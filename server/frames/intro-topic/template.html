<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 140px; right: 140px; top: 110px; bottom: 280px; display: flex; align-items: center; gap: 80px; }
        {{__r}} .text { flex: 1; display: flex; flex-direction: column; gap: 34px; }
        {{__r}} .kicker { align-self: flex-start; padding: 14px 30px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 36px; letter-spacing: 0.05em; text-transform: uppercase; }
        {{__r}} .title { font-size: 100px; line-height: 1.08; }
        {{__r}} .art { position: relative; flex: none; width: 560px; height: 560px; }
        {{__r}} .orbit { position: absolute; inset: 0; border-radius: 50%; border: 4px dashed var(--line); }
        {{__r}} .disc { position: absolute; inset: 70px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--bg2), var(--panel)); box-shadow: 0 30px 80px var(--glow); }
        {{__r}} .ico { position: absolute; left: 110px; top: 110px; width: 340px; height: 340px; }
        {{__r}} .dot { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--accent2); left: 50%; top: 0; }
        {{__r}} .dot.b { width: 22px; height: 22px; margin: -11px 0 0 -11px; background: var(--accent); top: 100%; }
        {{__r}} .spin { position: absolute; inset: 0; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="text">
        <div class="kicker">{{kicker}}</div>
        <div class="title">{{title}}</div>
        </div>
        <div class="art">
        <div class="orbit"></div>
        <div class="spin"><div class="dot"></div><div class="dot b"></div></div>
        <div class="disc"></div>
        <img class="ico" src="assets/icons/{{icon}}.svg" alt="" />
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".kicker"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo($(".title"), { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
          tl.fromTo($(".disc"), { scale: 0 }, { scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.15);
          tl.fromTo($(".orbit"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.25);
          tl.fromTo($(".ico"), { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(2)" }, 0.4);
          tl.fromTo($(".spin"), { rotation: 0 }, { rotation: 140, duration: P.D, ease: "none" }, 0);
          const bobs = Math.max(1, Math.floor((P.D - 1.6) / 1.2));
          tl.to($(".ico"), { y: -18, duration: 0.6, yoyo: true, repeat: bobs * 2 - 1, ease: "sine.inOut" }, 1.2);
          tl.to($(".wrap"), { opacity: 0, scale: 0.97, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
