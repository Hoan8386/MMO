<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 100px; right: 100px; top: 80px; bottom: 270px; display: flex; flex-direction: column; gap: 20px; }
        {{__r}} .title { font-size: 66px; text-align: center; }
        {{__r}} .track { position: relative; flex: 1; }
        {{__r}} .road { position: absolute; left: 60px; right: 60px; top: 62%; height: 10px; border-top: 10px dashed var(--line); }
        {{__r}} .stops { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; justify-content: space-around; }
        {{__r}} .st { position: relative; width: 260px; display: flex; flex-direction: column; align-items: center; }
        {{__r}} .st img { width: 170px; height: 170px; margin-top: 30px; }
        {{__r}} .pin { position: absolute; top: calc(62% - 18px); left: 50%; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: var(--bg2); border: 6px solid var(--accent); }
        {{__r}} .lb { position: absolute; top: calc(62% + 40px); font-size: 36px; text-align: center; white-space: nowrap; }
        {{__r}} .mover { position: absolute; top: calc(62% - 210px); left: 0; width: 200px; height: 200px; margin-left: -100px; }
        {{__r}} .mover img { width: 100%; height: 100%; scale: -1 1; filter: drop-shadow(0 16px 14px rgba(0, 0, 0, 0.25)); }
        {{__r}}:not([data-aspect="16x9"]) .wrap { justify-content: center; }
        {{__r}}:not([data-aspect="16x9"]) .track { flex: none; height: 640px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .st { width: 220px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .st img { width: 150px; height: 150px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .lb { font-size: 34px; white-space: normal; width: 230px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        {{#title}}<div class="title">{{title}}</div>{{/title}}
        <div class="track">
        <div class="road"></div>
        <div class="stops">{{#stops}}<div class="st"><img src="assets/icons/{{.}}.svg" alt="" /><div class="pin"></div><div class="lb">{{labels@}}</div></div>{{/stops}}</div>
        <div class="mover"><img class="ci" src="assets/characters/{{character}}.svg" alt="" /></div>
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const stops = $$(".st");
          // Stop centres in layout px (offsets ignore the scale applied to the whole scene).
          const xs = stops.map((s) => s.offsetLeft + s.offsetWidth / 2);
          if ($(".title")) tl.fromTo($(".title"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.05);
          tl.fromTo($(".road"), { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.1);
          tl.fromTo($$(".st img"), { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.45, stagger: 0.12, ease: "back.out(2)" }, 0.4);
          tl.fromTo($$(".pin"), { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.12, ease: "back.out(3)" }, 0.5);
          tl.fromTo($$(".lb"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.12 }, 0.6);
          // The character starts left of the first stop and hops to each stop on its keyword.
          const mover = $(".mover");
          tl.fromTo(mover, { x: -120, opacity: 0 }, { x: Math.max(0, xs[0] - 160), opacity: 1, duration: 0.5, ease: "power2.out" }, 0.6);
          let last = 0.9;
          stops.forEach((s, i) => {
          const t = Math.max(last + 0.6, at(i, stops.length) - 0.4);
          last = t;
          tl.to(mover, { x: xs[i], duration: 0.6, ease: "power1.inOut" }, t);
          tl.fromTo(mover.querySelector("img"), { y: 0 }, { y: -70, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.out" }, t);
          tl.fromTo(s.querySelector(".pin"), { scale: 1 }, { scale: 1.5, duration: 0.25, ease: "back.out(3)" }, t + 0.5);
          tl.fromTo(s.querySelector(".lb"), { y: 0 }, { y: -10, duration: 0.2, yoyo: true, repeat: 1 }, t + 0.5);
          });
          tl.to($(".wrap"), { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
