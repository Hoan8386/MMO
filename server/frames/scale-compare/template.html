<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 120px; right: 120px; top: 80px; bottom: 270px; display: flex; flex-direction: column; gap: 20px; }
        {{__r}} .title { font-size: 62px; line-height: 1.1; text-align: center; }
        {{__r}} .stage { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 70px; }
        {{__r}} .it { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        {{__r}} .c { position: relative; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--bg2), var(--panel)); border: 4px solid var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 60px var(--glow); }
        {{__r}} .c img { width: 70%; height: 70%; }
        {{__r}} .name { font-size: 38px; text-align: center; }
        {{__r}} .v { font-size: 34px; color: var(--accent2); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="title">{{title}}</div>
        <div class="stage">
        {{#labels}}<div class="it"><div class="c">{{?icons}}<img src="assets/icons/{{icons@}}.svg" alt="" />{{/?icons}}</div><div class="name">{{.}}</div><div class="v"></div></div>{{/labels}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const its = $$(".it");
          const vals = its.map((_, i) => Math.max(0, Number(P.values[i]) || 0));
          const max = Math.max(...vals, 0.0001);
          const stageH = ($(".stage").getBoundingClientRect().height || 560) - 110;
          const maxD = Math.min(stageH, 1500 / its.length);
          const dec = vals.some((v) => !Number.isInteger(v)) ? (vals.some((v) => v < 1) ? 2 : 1) : 0;
          tl.fromTo($(".title"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          let last = 0.4;
          its.forEach((el, i) => {
          const d = Math.max(110, (maxD * vals[i]) / max);
          const c = el.querySelector(".c");
          c.style.width = c.style.height = d + "px";
          el.querySelector(".v").textContent = vals[i].toLocaleString("vi-VN", { maximumFractionDigits: dec }) + (P.unit ? " " + P.unit : "");
          const t = Math.max(last + 0.3, at(i, its.length) - 0.1);
          last = t;
          tl.fromTo(c, { scale: 0 }, { scale: 1, duration: 0.7, ease: "back.out(1.6)" }, t);
          tl.fromTo([el.querySelector(".name"), el.querySelector(".v")], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1 }, t + 0.3);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
