<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 110px; right: 110px; top: 70px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
        {{__r}} .sides { display: flex; align-items: center; justify-content: space-between; }
        {{__r}} .side { width: 640px; display: flex; align-items: center; gap: 30px; }
        {{__r}} .side.r { flex-direction: row-reverse; text-align: right; }
        {{__r}} .side img { width: 180px; height: 180px; }
        {{__r}} .side .n { font-size: 70px; line-height: 1.05; }
        {{__r}} .l .n { color: var(--accent); } .r .n { color: var(--accent2); }
        {{__r}} .vs { width: 170px; height: 170px; border-radius: 50%; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 76px; font-style: italic; }
        {{__r}} .stats { display: flex; flex-direction: column; gap: 22px; }
        {{__r}} .st { display: grid; grid-template-columns: 110px 1fr 300px 1fr 110px; align-items: center; gap: 20px; }
        {{__r}} .st .v { font-size: 36px; font-variant-numeric: tabular-nums; }
        {{__r}} .st .v.lv { text-align: right; color: var(--accent); } .st .v.rv { color: var(--accent2); }
        {{__r}} .st .k { text-align: center; font-size: 32px; color: var(--muted); }
        {{__r}} .half { position: relative; height: 54px; border-radius: 12px; background: var(--panel); overflow: hidden; }
        {{__r}} .half i { position: absolute; top: 0; bottom: 0; border-radius: 12px; }
        {{__r}} .half.l i { right: 0; background: var(--accent); } .half.r i { left: 0; background: var(--accent2); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="sides">
        <div class="side l">{{#left_icon}}<img class="li" src="assets/icons/{{left_icon}}.svg" alt="" />{{/left_icon}}<div class="n">{{left}}</div></div>
        <div class="vs">VS</div>
        <div class="side r">{{#right_icon}}<img class="ri" src="assets/icons/{{right_icon}}.svg" alt="" />{{/right_icon}}<div class="n">{{right}}</div></div>
        </div>
        <div class="stats">
        {{#stats}}<div class="st"><div class="v lv"></div><div class="half l"><i></i></div><div class="k">{{.}}</div><div class="half r"><i></i></div><div class="v rv"></div></div>{{/stats}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".side.l"), { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo($(".side.r"), { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo($(".vs"), { scale: 3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "power4.in" }, 0.55);
          tl.fromTo($(".wrap"), { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 5 }, 1.05);
          const fmt = (v) => (Number(v) || 0).toLocaleString("vi-VN");
          $$(".st").forEach((row, i) => {
          const lv = Number(P.left_values[i]) || 0, rv = Number(P.right_values[i]) || 0;
          const m = Math.max(lv, rv, 0.0001);
          const [li, ri] = row.querySelectorAll("i");
          const [lb, rb] = row.querySelectorAll(".v");
          li.style.width = (100 * lv) / m + "%";
          ri.style.width = (100 * rv) / m + "%";
          lb.textContent = fmt(lv);
          rb.textContent = fmt(rv);
          const t = 1.3 + i * 0.35;
          tl.fromTo(row, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, t);
          tl.fromTo(li, { scaleX: 0, transformOrigin: "right center" }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, t + 0.1);
          tl.fromTo(ri, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, t + 0.1);
          });
          tl.to($(".wrap"), { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
