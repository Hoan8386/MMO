<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 0; right: 0; top: 70px; bottom: 270px; display: flex; align-items: center; justify-content: center; }
        {{__r}} .folder { position: relative; width: 1400px; padding: 70px 80px 150px; border-radius: 10px 26px 26px 26px; background: #E9D7AE; color: #2B2216; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
        {{__r}} .tab { position: absolute; left: 0; top: -58px; padding: 12px 40px; border-radius: 18px 18px 0 0; background: #E9D7AE; font-size: 30px; letter-spacing: 0.2em; }
        {{__r}} .title { font-size: 70px; line-height: 1.1; margin-bottom: 26px; font-family: "Courier New", monospace; font-weight: 700; }
        {{__r}} .meta { display: flex; gap: 60px; font-size: 34px; margin-bottom: 26px; }
        {{__r}} .meta span { color: #7A6545; }
        {{__r}} .fact { position: relative; font-family: "Courier New", monospace; font-weight: 700; font-size: 38px; line-height: 1.35; padding: 8px 0 8px 44px; border-top: 2px dashed rgba(43, 34, 22, 0.25); }
        {{__r}} .fact::before { content: "▸"; position: absolute; left: 0; }
        {{__r}} .stamp { position: absolute; right: 60px; bottom: 36px; padding: 14px 30px; border: 8px solid #E5484D; border-radius: 14px; color: #E5484D; font-size: 46px; letter-spacing: 0.06em; text-transform: uppercase; transform: rotate(-10deg); opacity: 0.85; }
        {{__r}} .clip { position: absolute; right: 180px; top: -40px; width: 60px; height: 130px; border: 10px solid #9AA0A6; border-radius: 30px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="folder">
        <div class="tab">HỒ SƠ</div>
        <div class="clip"></div>
        <div class="title">{{title}}</div>
        <div class="meta">{{#date}}<div><span>Thời gian:</span> {{date}}</div>{{/date}}{{#place}}<div><span>Địa điểm:</span> {{place}}</div>{{/place}}</div>
        {{#facts}}<div class="fact">{{.}}</div>{{/facts}}
        {{#status}}<div class="stamp">{{status}}</div>{{/status}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".folder"), { opacity: 0, y: 120, rotation: 3 }, { opacity: 1, y: 0, rotation: -1, duration: 0.7, ease: "power3.out" }, 0.05);
          tl.fromTo($(".title"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
          tl.fromTo($(".meta"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5 }, 0.7);
          const facts = $$(".fact");
          let last = 0.9;
          facts.forEach((el, i) => {
          const t = Math.max(last + 0.3, at(i, facts.length) - 0.1);
          last = t;
          tl.fromTo(el, { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "steps(24)" }, t);
          });
          if ($(".stamp")) {
          const t = Math.min(P.D - 1, last + 1);
          tl.fromTo($(".stamp"), { opacity: 0, scale: 2.4 }, { opacity: 0.85, scale: 1, duration: 0.25, ease: "power4.in" }, t);
          tl.fromTo($(".folder"), { y: 0 }, { y: 6, duration: 0.06, yoyo: true, repeat: 1 }, t + 0.25);
          }
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
