<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 0; right: 0; top: 90px; bottom: 280px; display: flex; align-items: center; justify-content: center; }
        {{__r}} .card { width: 1400px; padding: 56px 70px; border-radius: 32px; background: var(--panel); border: 3px solid var(--line); border-left: 14px solid var(--accent); display: flex; flex-direction: column; gap: 30px; }
        {{__r}} .title { font-size: 68px; color: var(--accent); }
        {{__r}} .pt { display: flex; align-items: center; gap: 28px; font-size: 46px; line-height: 1.3; }
        {{__r}} .ck { position: relative; flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--accent2); }
        {{__r}} .ck::after { content: ""; position: absolute; left: 19px; top: 10px; width: 13px; height: 25px; border: solid var(--on-accent); border-width: 0 7px 7px 0; transform: rotate(45deg); }
        /* Narrower formats: the card follows the frame width. */
        {{__r}}:not([data-aspect="16x9"]) .card { width: auto; margin: 0 80px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="card">
        <div class="title">{{title}}</div>
        {{#points}}<div class="pt"><span class="ck"></span><span>{{.}}</span></div>{{/points}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".card"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
          tl.fromTo($(".title"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5 }, 0.3);
          let last = 0.4;
          $$(".pt").forEach((el, i, all) => {
          const t = Math.max(last + 0.3, at(i, all.length) - 0.1);
          last = t;
          tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t);
          tl.fromTo(el.querySelector(".ck"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.5)" }, t + 0.1);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
