<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 90px; bottom: 270px; display: flex; flex-direction: column; gap: 30px; }
        {{__r}} .title { font-size: 66px; line-height: 1.1; }
        {{__r}} .chart { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 46px; padding: 0 40px; border-bottom: 4px solid var(--line); }
        {{__r}} .col { flex: 1; max-width: 220px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 12px; }
        {{__r}} .val { font-size: 40px; font-variant-numeric: tabular-nums; }
        {{__r}} .bar { width: 100%; border-radius: 14px 14px 0 0; background: var(--accent2); opacity: 0.75; }
        {{__r}} .col.max .bar { background: linear-gradient(180deg, var(--accent), var(--accent2)); opacity: 1; }
        {{__r}} .col.max .val { color: var(--accent); }
        {{__r}} .labels { display: flex; justify-content: center; gap: 46px; padding: 0 40px; margin-top: -16px; }
        {{__r}} .lab { flex: 1; max-width: 220px; text-align: center; font-size: 32px; color: var(--muted); }
        {{__r}} .source { font-size: 26px; color: var(--muted); text-align: right; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="title">{{title}}</div>
        <div class="chart">
        {{#labels}}<div class="col"><div class="val">0</div><div class="bar"></div></div>{{/labels}}
        </div>
        <div class="labels">{{#labels}}<div class="lab">{{.}}</div>{{/labels}}</div>
        {{#source}}<div class="source">Nguồn: {{source}}</div>{{/source}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const cols = $$(".col");
          const vals = cols.map((_, i) => Number(P.values[i]) || 0);
          const max = Math.max(...vals, 0.0001);
          const dec = vals.some((v) => !Number.isInteger(v)) ? 1 : 0;
          const fmt = (v) => v.toLocaleString("vi-VN", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + (P.unit || "");
          const chartH = $(".chart").getBoundingClientRect().height || 420;
          tl.fromTo($(".title"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo($$(".lab"), { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.08 }, 0.4);
          const start = Math.min(P.D - 2, Math.max(0.6, P.marks[0] ?? P.vo + 0.3));
          cols.forEach((col, i) => {
          if (vals[i] === max) col.classList.add("max");
          const bar = col.querySelector(".bar");
          const val = col.querySelector(".val");
          bar.style.height = Math.max(6, ((chartH - 70) * vals[i]) / max) + "px";
          val.textContent = fmt(0);
          const t = start + i * 0.18;
          tl.fromTo(bar, { scaleY: 0, transformOrigin: "bottom center" }, { scaleY: 1, duration: 0.8, ease: "power3.out" }, t);
          const c = { v: 0 };
          tl.fromTo(c, { v: 0 }, { v: vals[i], duration: 0.8, ease: "power3.out", onUpdate: () => (val.textContent = fmt(c.v)) }, t);
          });
          if ($(".source")) tl.fromTo($(".source"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, start + 0.8);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
