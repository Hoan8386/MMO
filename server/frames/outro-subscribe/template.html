<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 140px; right: 140px; top: 100px; bottom: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; text-align: center; }
        {{__r}} .message { font-size: 96px; line-height: 1.12; }
        {{__r}} .cta { display: flex; align-items: center; gap: 22px; padding: 26px 48px; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent); font-size: 44px; }
        {{__r}} .bell { width: 44px; height: 44px; border-radius: 50%; background: var(--on-accent); }
        {{__r}} .channel { font-size: 36px; color: var(--muted); letter-spacing: 0.08em; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
          <div class="message">{{message}}</div>
          <div class="cta"><span class="bell"></span><span>{{cta}}</span></div>
          {{#channel}}<div class="channel">{{channel}}</div>{{/channel}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($(".message"), { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.1);
          tl.fromTo($(".cta"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.6);
          tl.fromTo($(".bell"), { rotation: -18 }, { rotation: 18, duration: 0.18, repeat: 5, yoyo: true, ease: "sine.inOut" }, 1.3);
          if ($(".channel")) tl.fromTo($(".channel"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1);
          tl.to($(".wrap"), { opacity: 0, duration: 0.5, ease: "power2.in" }, P.D - 0.55);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
