<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 120px; right: 120px; top: 70px; bottom: 270px; display: flex; flex-direction: column; gap: 24px; }
        {{__r}} .when { align-self: flex-start; padding: 10px 28px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 36px; }
        {{__r}} .stage { position: relative; flex: 1; min-height: 360px; }
        {{__r}} .ground { position: absolute; left: -40px; right: -40px; bottom: 0; height: 120px; border-radius: 50%; background: radial-gradient(ellipse at 50% 0%, var(--panel), transparent 70%); border-top: 4px solid var(--line); }
        {{__r}} .props { position: absolute; left: 0; right: 0; bottom: 50px; display: flex; justify-content: flex-end; align-items: flex-end; gap: 40px; padding-right: 40px; }
        {{__r}} .prop { width: 230px; height: 230px; }
        {{__r}} .mover { position: absolute; left: 20%; bottom: 40px; width: 330px; height: 330px; }
        {{__r}} .mover img { width: 100%; height: 100%; scale: -1 1; filter: drop-shadow(0 20px 18px rgba(0, 0, 0, 0.22)); }
        {{__r}} .caption { padding: 26px 40px; border-radius: 24px; background: var(--panel); border: 2px solid var(--line); font-size: 50px; line-height: 1.25; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .props { justify-content: center; padding-right: 0; gap: 20px; bottom: 360px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .prop { width: 200px; height: 200px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .mover { left: 50%; margin-left: -190px; width: 380px; height: 380px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .caption { font-size: 54px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        {{#when}}<div class="when">{{when}}</div>{{/when}}
        <div class="stage">
        <div class="ground"></div>
        {{?props}}<div class="props">{{#props}}<img class="prop" src="assets/icons/{{.}}.svg" alt="" />{{/props}}</div>{{/?props}}
        <div class="mover"><img class="ci" src="assets/characters/{{character}}.svg" alt="" /></div>
        </div>
        <div class="caption">{{caption}}</div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          if ($(".when")) tl.fromTo($(".when"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo($(".ground"), { scaleX: 0.3, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.05);
          tl.fromTo($$(".prop"), { scale: 0, y: 60, transformOrigin: "50% 100%" }, { scale: 1, y: 0, duration: 0.55, stagger: 0.15, ease: "back.out(1.8)" }, 0.25);
          // The character walks in from the left with small hops, then breathes in place.
          tl.fromTo($(".mover"), { x: -900, opacity: 0 }, { x: 0, opacity: 1, duration: 1.3, ease: "power2.out" }, 0.3);
          tl.fromTo($(".mover img"), { y: 0 }, { y: -28, duration: 0.16, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0.3);
          const breaths = Math.max(1, Math.floor((P.D - 2.3) / 1.4));
          tl.to($(".mover img"), { scaleY: 1.05, duration: 0.7, yoyo: true, repeat: breaths * 2 - 1, ease: "sine.inOut", transformOrigin: "50% 100%" }, 1.7);
          tl.fromTo($(".caption"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          tl.to($(".wrap"), { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
