<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 110px; right: 110px; top: 60px; bottom: 270px; display: flex; flex-direction: column; gap: 16px; }
        {{__r}} .talk { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; padding: 0 280px; }
        {{__r}} .b { position: relative; max-width: 78%; padding: 24px 36px; border-radius: 36px; font-size: 44px; line-height: 1.25; }
        {{__r}} .b.l { align-self: flex-start; background: var(--bg2); border: 4px solid var(--accent); border-bottom-left-radius: 8px; }
        {{__r}} .b.r { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 8px; }
        {{__r}} .cast { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
        {{__r}} .p { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        {{__r}} .p img { width: 260px; height: 260px; filter: drop-shadow(0 16px 16px rgba(0, 0, 0, 0.22)); }
        {{__r}} .p.left img { scale: -1 1; }
        {{__r}} .n { font-size: 32px; padding: 4px 18px; border-radius: 10px; background: var(--panel); }
        {{__r}}:not([data-aspect="16x9"]) .talk { padding: 0 0 420px; }
        {{__r}}:not([data-aspect="16x9"]) .b { max-width: 90%; font-size: 56px; padding: 28px 40px; }
        {{__r}}:not([data-aspect="16x9"]) .p img { width: 360px; height: 360px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="talk">{{#lines}}<div class="b">{{.}}</div>{{/lines}}</div>
        <div class="cast">
        <div class="p left"><div class="fig"><img class="li" src="assets/characters/{{left}}.svg" alt="" /></div>{{#left_name}}<div class="n">{{left_name}}</div>{{/left_name}}</div>
        <div class="p right"><div class="fig"><img class="ri" src="assets/characters/{{right}}.svg" alt="" /></div>{{#right_name}}<div class="n">{{right_name}}</div>{{/right_name}}</div>
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const bubbles = $$(".b");
          bubbles.forEach((b, i) => b.classList.add(i % 2 ? "r" : "l"));
          const figs = [$(".left .fig"), $(".right .fig")];
          tl.fromTo(figs[0], { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.05);
          tl.fromTo(figs[1], { x: 400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.15);
          tl.fromTo($$(".n"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
          let last = 0.5;
          bubbles.forEach((b, i) => {
          const t = Math.max(last + 0.4, at(i, bubbles.length) - 0.15);
          last = t;
          tl.fromTo(b, { opacity: 0, scale: 0.5, transformOrigin: i % 2 ? "100% 100%" : "0% 100%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, t);
          // The speaker hops; earlier bubbles fade a little so the newest one stands out.
          tl.fromTo(figs[i % 2], { y: 0 }, { y: -40, duration: 0.18, yoyo: true, repeat: 3, ease: "power1.out" }, t);
          if (i) tl.to(bubbles.slice(0, i), { opacity: 0.7, duration: 0.3 }, t);
          });
          tl.to($(".wrap"), { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
