<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 140px; right: 140px; top: 90px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
        {{__r}} .title { font-size: 70px; line-height: 1.12; text-align: center; }
        {{__r}} .cols { display: flex; gap: 50px; }
        {{__r}} .col { flex: 1; padding: 36px 40px; border-radius: 30px; background: var(--panel); border-top: 12px solid; display: flex; flex-direction: column; gap: 22px; }
        {{__r}} .col.do { border-color: #12A37F; } .col.dont { border-color: #E5484D; }
        {{__r}} .head { font-size: 40px; letter-spacing: 0.08em; text-transform: uppercase; }
        {{__r}} .do .head { color: #12A37F; } .dont .head { color: #E5484D; }
        {{__r}} .row { display: flex; align-items: center; gap: 22px; font-size: 44px; line-height: 1.2; }
        {{__r}} .row b { flex: none; width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 38px; }
        {{__r}} .do .row b { background: #12A37F; } .dont .row b { background: #E5484D; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="title">{{title}}</div>
        <div class="cols">
        <div class="col do"><div class="head">Nên</div>{{#dos}}<div class="row"><b>✓</b><span>{{.}}</span></div>{{/dos}}</div>
        <div class="col dont"><div class="head">Không nên</div>{{#donts}}<div class="row"><b>✕</b><span>{{.}}</span></div>{{/donts}}</div>
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".title"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          const tDo = Math.max(0.4, Math.min(P.D - 2.5, (P.marks[0] ?? P.vo) - 0.1));
          const tDont = Math.max(tDo + 0.8, Math.min(P.D - 1.4, (P.marks[1] ?? P.vo + (P.voEnd - P.vo) * 0.5) - 0.1));
          [[".do", tDo], [".dont", tDont]].forEach(([c, t]) => {
          tl.fromTo($(c), { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, t);
          tl.fromTo($$(c + " .row"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.25, ease: "power2.out" }, t + 0.25);
          tl.fromTo($$(c + " .row b"), { scale: 0 }, { scale: 1, duration: 0.4, stagger: 0.25, ease: "back.out(2.5)" }, t + 0.3);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
