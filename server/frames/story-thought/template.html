<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 140px; right: 140px; top: 60px; bottom: 270px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        {{__r}} .cloud { position: relative; display: flex; align-items: center; gap: 36px; max-width: 1300px; padding: 50px 70px; border-radius: 120px; background: var(--bg2); border: 4px solid var(--line); box-shadow: 0 0 0 14px var(--panel); font-size: 56px; line-height: 1.25; }
        {{__r}} .cloud img { flex: none; width: 170px; height: 170px; }
        {{__r}} .dots { position: relative; width: 300px; height: 120px; }
        {{__r}} .dot { position: absolute; border-radius: 50%; background: var(--bg2); border: 4px solid var(--line); }
        {{__r}} .d1 { width: 70px; height: 70px; left: 120px; top: 0; } .d2 { width: 46px; height: 46px; left: 90px; top: 60px; } .d3 { width: 28px; height: 28px; left: 70px; top: 100px; }
        {{__r}} .who { width: 300px; height: 300px; margin-left: -260px; }
        {{__r}} .who img { width: 100%; height: 100%; filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.22)); }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .cloud { flex-direction: column; text-align: center; border-radius: 80px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .who { width: 380px; height: 380px; margin-left: -200px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="cloud">{{#thought_icon}}<img src="assets/icons/{{thought_icon}}.svg" alt="" />{{/thought_icon}}<span>{{thought}}</span></div>
        <div class="dots"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div></div>
        <div class="who"><img class="ci" src="assets/characters/{{character}}.svg" alt="" /></div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".who"), { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.05);
          tl.fromTo([$(".d3"), $(".d2"), $(".d1")], { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.15, ease: "back.out(3)" }, 0.5);
          tl.fromTo($(".cloud"), { scale: 0.2, opacity: 0, transformOrigin: "30% 100%" }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.9);
          if ($(".cloud img")) tl.fromTo($(".cloud img"), { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 1.25);
          const floats = Math.max(1, Math.floor((P.D - 2.2) / 1.6));
          tl.to($(".cloud"), { y: -14, duration: 0.8, yoyo: true, repeat: floats * 2 - 1, ease: "sine.inOut" }, 1.5);
          tl.to($(".who"), { rotation: 5, duration: 0.8, yoyo: true, repeat: floats * 2 - 1, ease: "sine.inOut", transformOrigin: "50% 100%" }, 1.5);
          tl.to($(".wrap"), { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
