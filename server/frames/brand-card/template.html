<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 160px; right: 160px; top: 80px; bottom: 270px; display: flex; align-items: center; gap: 90px; }
        {{__r}} .tile { flex: none; width: 460px; height: 460px; border-radius: 60px; background: #FFFFFF; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.18), inset 0 0 0 2px rgba(0, 0, 0, 0.05); display: flex; align-items: center; justify-content: center; }
        {{__r}} .tile img { width: 300px; height: 300px; object-fit: contain; }
        {{__r}} .text { flex: 1; display: flex; flex-direction: column; gap: 22px; }
        {{__r}} .name { font-size: 100px; line-height: 1.04; }
        {{__r}} .founded { align-self: flex-start; padding: 10px 26px; border-radius: 999px; border: 3px solid var(--accent); color: var(--accent); font-size: 36px; }
        {{__r}} .fact { display: flex; gap: 18px; align-items: center; font-size: 42px; line-height: 1.25; }
        {{__r}} .fact::before { content: ""; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent2); }
        /* Tall formats: stack the visual above the text. */
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .wrap { flex-direction: column; justify-content: center; gap: 60px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .text { flex: none; align-self: stretch; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="tile"><img src="assets/logos/{{logo}}.svg" alt="" /></div>
        <div class="text">
        <div class="name">{{name}}</div>
        {{#founded}}<div class="founded">{{founded}}</div>{{/founded}}
        {{#facts}}<div class="fact">{{.}}</div>{{/facts}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".tile"), { opacity: 0, scale: 0.5, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.6)" }, 0.05);
          tl.fromTo($(".tile img"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 0.4);
          tl.fromTo($(".name"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.4);
          if ($(".founded")) tl.fromTo($(".founded"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 0.7);
          const fs = $$(".fact");
          let last = 0.9;
          fs.forEach((el, i) => {
          const t = Math.max(last + 0.25, at(i, fs.length) - 0.1);
          last = t;
          tl.fromTo(el, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, t);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
