<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 120px; right: 120px; top: 90px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
        {{__r}} .q { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
        {{__r}} .chip { padding: 12px 32px; border-radius: 999px; border: 3px solid var(--accent); color: var(--accent); font-size: 36px; letter-spacing: 0.08em; text-transform: uppercase; }
        {{__r}} .question { font-size: 80px; line-height: 1.12; max-width: 1500px; }
        {{__r}} .chain { display: flex; align-items: stretch; justify-content: center; }
        {{__r}} .step { flex: 1; max-width: 400px; padding: 30px 30px; border-radius: 26px; background: var(--panel); border: 2px solid var(--line); font-size: 38px; line-height: 1.25; display: flex; flex-direction: column; gap: 14px; }
        {{__r}} .step b { width: 54px; height: 54px; border-radius: 50%; background: var(--accent2); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 30px; }
        {{__r}} .arrow { flex: none; width: 80px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 60px; }
        {{__r}} .chain .arrow:first-child { display: none; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="q"><div class="chip">Nếu như…</div><div class="question">{{question}}</div></div>
        <div class="chain">
        {{#steps}}<div class="arrow">➜</div><div class="step"><b>{{@n}}</b><span>{{.}}</span></div>{{/steps}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".chip"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.1);
          tl.fromTo($(".question"), { opacity: 0, y: 40, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 0.3);
          const steps = $$(".step"), arrows = $$(".arrow");
          let last = 1;
          steps.forEach((el, i) => {
          const t = Math.max(last + 0.35, at(i, steps.length) - 0.15);
          last = t;
          if (i) tl.fromTo(arrows[i], { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, t - 0.15);
          tl.fromTo(el, { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
