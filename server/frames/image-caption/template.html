<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 120px; right: 120px; top: 90px; bottom: 270px; display: flex; align-items: center; gap: 70px; }
        {{__r}} .frame { flex: none; width: 1040px; height: 680px; border-radius: 28px; overflow: hidden; position: relative; border: 2px solid var(--line); background: var(--panel); }
        {{__r}} .kb { position: absolute; inset: 0; }
        {{__r}} .kb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        {{__r}} .text { display: flex; flex-direction: column; gap: 26px; }
        {{__r}} .title { font-size: 64px; line-height: 1.15; }
        {{__r}} .bar { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
        {{__r}} .caption { font-size: 40px; line-height: 1.4; color: var(--muted); }
        {{__r}} .credit { font-size: 26px; color: var(--muted); opacity: 0.8; }
        /* Narrower formats: picture on top, text below. */
        {{__r}}:not([data-aspect="16x9"]) .wrap { flex-direction: column; justify-content: center; align-items: stretch; gap: 50px; }
        {{__r}}:not([data-aspect="16x9"]) .frame { width: 100%; height: auto; aspect-ratio: 1040 / 680; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
          <div class="frame"><div class="kb"><img src="assets/img/{{image}}" alt="" /></div></div>
          <div class="text">
            <div class="title">{{title}}</div>
            <div class="bar"></div>
            {{#caption}}<div class="caption">{{caption}}</div>{{/caption}}
            {{#credit}}<div class="credit">{{credit}}</div>{{/credit}}
          </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($(".frame"), { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.05);
          tl.fromTo($(".kb"), { scale: 1.12 }, { scale: 1.0, duration: P.D, ease: "none" }, 0);
          tl.fromTo($(".title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35);
          tl.fromTo($(".bar"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.55);
          if ($(".caption")) tl.fromTo($(".caption"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.75);
          if ($(".credit")) tl.fromTo($(".credit"), { opacity: 0 }, { opacity: 0.8, duration: 0.5 }, 1);
          tl.to($(".wrap"), { opacity: 0, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
