<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 200px; right: 200px; top: 100px; bottom: 280px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
        {{__r}} .mark { font-size: 260px; line-height: 0.6; height: 110px; color: var(--accent); }
        {{__r}} .quote { font-size: 64px; line-height: 1.3; max-width: 1450px; }
        {{__r}} .who { display: flex; align-items: center; gap: 24px; }
        {{__r}} .line { width: 80px; height: 6px; border-radius: 3px; background: var(--accent2); }
        {{__r}} .author { font-size: 40px; }
        {{__r}} .role { font-size: 32px; color: var(--muted); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
          <div class="mark">“</div>
          <div class="quote">{{quote}}</div>
          <div class="who">
            <div class="line"></div>
            <div><div class="author">{{author}}</div>{{#role}}<div class="role">{{role}}</div>{{/role}}</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($(".mark"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.8)" }, 0.05);
          tl.fromTo($(".quote"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.25);
          tl.fromTo($(".line"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.8);
          tl.fromTo($(".who > div:last-child"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.95);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
