<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 180px; right: 180px; top: 90px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
        {{__r}} .card { position: relative; display: flex; align-items: center; gap: 40px; padding: 44px 56px; border-radius: 30px; background: var(--panel); border: 4px solid var(--line); }
        {{__r}} .myth { border-color: #E5484D; }
        {{__r}} .fact { border-color: #12A37F; box-shadow: 14px 14px 0 #12A37F33; }
        {{__r}} .mark { flex: none; width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 74px; line-height: 1; }
        {{__r}} .myth .mark { background: #E5484D; } .fact .mark { background: #12A37F; }
        {{__r}} .tag { font-size: 32px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
        {{__r}} .myth .tag { color: #E5484D; } .fact .tag { color: #12A37F; }
        {{__r}} .body { font-size: 54px; line-height: 1.22; }
        {{__r}} .strike { position: absolute; left: 200px; right: 50px; top: 50%; height: 8px; border-radius: 4px; background: #E5484D; transform-origin: left center; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="card myth"><div class="mark">✕</div><div><div class="tag">Lầm tưởng</div><div class="body">{{myth}}</div></div><div class="strike"></div></div>
        <div class="card fact"><div class="mark">✓</div><div><div class="tag">Sự thật</div><div class="body">{{fact}}</div></div></div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const turn = Math.min(P.D - 1.6, Math.max(1.4, (P.marks[0] ?? P.vo + (P.voEnd - P.vo) * 0.45) - 0.2));
          tl.fromTo($(".myth"), { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo($(".myth .mark"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.35);
          tl.fromTo($(".strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, turn - 0.35);
          tl.to($(".myth"), { opacity: 0.45, scale: 0.97, duration: 0.4 }, turn - 0.1);
          tl.fromTo($(".fact"), { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.4)" }, turn);
          tl.fromTo($(".fact .mark"), { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" }, turn + 0.2);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
