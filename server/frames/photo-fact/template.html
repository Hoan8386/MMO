<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .kb { position: absolute; inset: 0; overflow: hidden; }
        {{__r}} .kb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        {{__r}} .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.78) 100%); }
        {{__r}} .box { position: absolute; left: 130px; right: 130px; bottom: 300px; display: flex; flex-direction: column; gap: 22px; color: #fff; }
        {{__r}} .label { align-self: flex-start; padding: 10px 26px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 34px; letter-spacing: 0.04em; text-transform: uppercase; }
        {{__r}} .text { font-size: 76px; line-height: 1.15; max-width: 1500px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        {{__r}} .credit { position: absolute; right: 40px; top: 34px; font-size: 22px; color: rgba(255, 255, 255, 0.85); background: rgba(0, 0, 0, 0.4); padding: 6px 14px; border-radius: 8px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="kb"><img src="assets/img/{{image}}" alt="" /></div>
        <div class="shade"></div>
        <div class="box">
        {{#label}}<div class="label">{{label}}</div>{{/label}}
        <div class="text">{{text}}</div>
        </div>
        {{#credit}}<div class="credit">{{credit}}</div>{{/credit}}
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".kb"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo($(".kb img"), { scale: 1.04, xPercent: -1.5 }, { scale: 1.16, xPercent: 1.5, duration: P.D, ease: "none" }, 0);
          tl.fromTo($(".shade"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.2);
          if ($(".label")) tl.fromTo($(".label"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.45);
          tl.fromTo($(".text"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.6);
          if ($(".credit")) tl.fromTo($(".credit"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
          tl.to([$(".box"), $(".shade"), $(".kb")], { opacity: 0, duration: 0.45, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
