<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 140px; right: 120px; top: 90px; bottom: 270px; display: flex; align-items: center; gap: 70px; }
        {{__r}} .text { flex: 1; display: flex; flex-direction: column; gap: 26px; }
        {{__r}} .label { align-self: flex-start; padding: 10px 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; }
        {{__r}} .title { font-size: 80px; line-height: 1.1; }
        {{__r}} .points { display: flex; flex-direction: column; gap: 18px; margin-top: 6px; }
        {{__r}} .pt { display: flex; align-items: center; gap: 22px; font-size: 42px; line-height: 1.3; color: var(--muted); }
        {{__r}} .pt b { flex: none; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 26px; }
        {{__r}} .stage { position: relative; flex: none; width: 700px; height: 700px; display: flex; align-items: center; justify-content: center; }
        {{__r}} .rays { position: absolute; inset: -80px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, var(--glow) 0deg 8deg, transparent 8deg 22deg); -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%); opacity: 0.8; }
        {{__r}} .halo { position: absolute; inset: 70px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--bg2), var(--panel) 60%, transparent 72%); box-shadow: 0 0 120px var(--glow); }
        {{__r}} .ring { position: absolute; inset: 40px; border-radius: 50%; border: 4px dashed var(--accent); opacity: 0.55; }
        {{__r}} .floor { position: absolute; left: 160px; right: 160px; bottom: 50px; height: 50px; border-radius: 50%; background: rgba(0, 0, 0, 0.35); filter: blur(14px); }
        {{__r}} .obj { position: relative; max-width: 560px; max-height: 560px; object-fit: contain; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.35)); }
        {{__r}} .credit { position: absolute; right: 0; bottom: -10px; font-size: 20px; color: var(--muted); opacity: 0.7; }
        /* Tall formats: object above the text. */
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .wrap { flex-direction: column-reverse; justify-content: center; gap: 40px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .text { flex: none; align-self: stretch; }
        {{__r}}:not([data-aspect="16x9"]) .stage { width: 640px; height: 640px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
          <div class="text">
            {{#label}}<div class="label">{{label}}</div>{{/label}}
            <div class="title">{{title}}</div>
            {{?points}}<div class="points">{{#points}}<div class="pt"><b>{{@n}}</b><span>{{.}}</span></div>{{/points}}</div>{{/?points}}
          </div>
          <div class="stage">
            <div class="rays"></div><div class="halo"></div><div class="ring"></div><div class="floor"></div>
            <img class="obj" src="assets/cutouts/{{cutout}}.png" alt="" />
            {{#credit}}<div class="credit">{{credit}}</div>{{/credit}}
          </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.9, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.35)) / n));
          tl.fromTo($(".halo"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.05);
          tl.fromTo($(".rays"), { opacity: 0, rotation: -40 }, { opacity: 0.8, rotation: 0, duration: 0.9, ease: "power2.out" }, 0.1);
          tl.fromTo($(".ring"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 0.55, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo($(".obj"), { y: 120, scale: 0.55, rotation: -12, opacity: 0 }, { y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.85, ease: "back.out(1.7)" }, 0.25);
          tl.fromTo($(".floor"), { scaleX: 0.2, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.3);
          if ($(".credit")) tl.fromTo($(".credit"), { opacity: 0 }, { opacity: 0.7, duration: 0.5 }, 0.9);
          if ($(".label")) tl.fromTo($(".label"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo($(".title"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.45);
          const pts = $$(".pt");
          pts.forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at(i, pts.length));
            tl.fromTo(el.querySelector("b"), { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, at(i, pts.length) + 0.05);
          });
          // Hold: the rays and ring turn slowly; the object gently breathes in place.
          tl.to($(".rays"), { rotation: 60, duration: P.D - 1, ease: "none" }, 1);
          tl.to($(".ring"), { rotation: -90, duration: P.D - 1, ease: "none" }, 1);
          const breaths = Math.max(1, Math.floor((P.D - 1.9) / 2.4));
          tl.to($(".obj"), { scale: 1.04, duration: 1.2, yoyo: true, repeat: breaths * 2 - 1, ease: "sine.inOut" }, 1.15);
          tl.to($(".wrap"), { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
