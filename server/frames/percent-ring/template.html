<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 90px; bottom: 270px; display: flex; align-items: center; gap: 90px; }
        {{__r}} .ring { position: relative; flex: none; width: 600px; height: 600px; }
        {{__r}} .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
        {{__r}} .ring circle { fill: none; stroke-width: 46; }
        {{__r}} .ring .bg { stroke: var(--line); }
        {{__r}} .ring .fg { stroke: url(#{{__id}}-grad); stroke-linecap: round; }
        {{__r}} .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        {{__r}} .ico { width: 130px; height: 130px; }
        {{__r}} .num { font-size: 140px; line-height: 1; font-variant-numeric: tabular-nums; }
        {{__r}} .num small { font-size: 70px; color: var(--accent); }
        {{__r}} .text { flex: 1; display: flex; flex-direction: column; gap: 26px; }
        {{__r}} .label { font-size: 64px; line-height: 1.2; }
        {{__r}} .source { font-size: 28px; color: var(--muted); }
        /* Tall formats: stack the visual above the text. */
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .wrap { flex-direction: column; justify-content: center; gap: 60px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .text { flex: none; align-self: stretch; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="ring">
        <svg viewBox="0 0 600 600"><defs><linearGradient id="{{__id}}-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)" /><stop offset="1" stop-color="var(--accent2)" /></linearGradient></defs>
        <circle class="bg" cx="300" cy="300" r="250" /><circle class="fg" cx="300" cy="300" r="250" /></svg>
        <div class="center">{{#icon}}<img class="ico" src="assets/icons/{{icon}}.svg" alt="" />{{/icon}}<div class="num"><span>0</span><small>%</small></div></div>
        </div>
        <div class="text">
        <div class="label">{{label}}</div>
        {{#source}}<div class="source">Nguồn: {{source}}</div>{{/source}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const C = 2 * Math.PI * 250;
          const fg = $(".fg");
          const val = Math.max(0, Math.min(100, Number(P.value) || 0));
          const dec = Number.isInteger(val) ? 0 : 1;
          const out = $(".num span");
          fg.style.strokeDasharray = C;
          fg.style.strokeDashoffset = C;
          tl.fromTo($(".ring"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 0.05);
          if ($(".ico")) tl.fromTo($(".ico"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.4);
          const t = Math.min(P.D - 1.8, Math.max(0.5, (P.marks[0] ?? P.vo) - 0.1));
          const c = { v: 0 };
          tl.fromTo(c, { v: 0 }, { v: val, duration: 1.3, ease: "power2.out", onUpdate: () => { out.textContent = c.v.toLocaleString("vi-VN", { minimumFractionDigits: dec, maximumFractionDigits: dec }); fg.style.strokeDashoffset = C * (1 - c.v / 100); } }, t);
          tl.fromTo($(".label"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.5);
          if ($(".source")) tl.fromTo($(".source"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
          tl.to($(".wrap"), { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
