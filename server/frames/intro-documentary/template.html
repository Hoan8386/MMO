<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .bar { position: absolute; left: 0; right: 0; height: 110px; background: #000; }
        {{__r}} .bar.top { top: 0; } .bar.bot { bottom: 0; }
        {{__r}} .wrap { position: absolute; left: 160px; right: 160px; top: 150px; bottom: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; }
        {{__r}} .kicker { display: flex; align-items: center; gap: 26px; font-size: 34px; color: var(--accent); letter-spacing: 0.3em; text-transform: uppercase; }
        {{__r}} .kicker i { display: block; width: 120px; height: 3px; background: var(--accent); }
        {{__r}} .title { font-size: 112px; line-height: 1.05; }
        {{__r}} .subtitle { font-size: 40px; color: var(--muted); letter-spacing: 0.04em; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="kicker"><i></i><span>{{kicker}}</span><i></i></div>
        <div class="title">{{title}}</div>
        {{#subtitle}}<div class="subtitle">{{subtitle}}</div>{{/subtitle}}
        </div>
        <div class="bar top"></div><div class="bar bot"></div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".bar.top"), { yPercent: -100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 0);
          tl.fromTo($(".bar.bot"), { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 0);
          tl.fromTo($$(".kicker i"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.3);
          tl.fromTo($(".kicker span"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.4);
          tl.fromTo($(".title"), { opacity: 0, letterSpacing: "0.12em", filter: "blur(8px)" }, { opacity: 1, letterSpacing: "0em", filter: "blur(0px)", duration: 1.4, ease: "power2.out" }, 0.55);
          if ($(".subtitle")) tl.fromTo($(".subtitle"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6 }, 1.3);
          tl.fromTo($(".wrap"), { scale: 1 }, { scale: 1.04, duration: P.D, ease: "none" }, 0);
          tl.to($(".wrap"), { opacity: 0, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
