<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 90px; bottom: 270px; display: flex; flex-direction: column; gap: 24px; }
        {{__r}} .title { font-size: 64px; line-height: 1.1; }
        {{__r}} .chart { position: relative; flex: 1; }
        {{__r}} .chart svg { position: absolute; inset: 0; overflow: visible; }
        {{__r}} .grid line { stroke: var(--line); stroke-width: 2; }
        {{__r}} .area { fill: url(#{{__id}}-area); opacity: 0.5; }
        {{__r}} .line { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
        {{__r}} .pt { fill: var(--bg); stroke: var(--accent); stroke-width: 7; }
        {{__r}} .pt.last { fill: var(--accent2); stroke: var(--accent2); }
        {{__r}} .lab { fill: var(--muted); font-size: 30px; text-anchor: middle; }
        {{__r}} .val { fill: var(--ink); font-size: 34px; text-anchor: middle; }
        {{__r}} .val.last { fill: var(--accent2); font-size: 52px; }
        {{__r}} .source { font-size: 26px; color: var(--muted); text-align: right; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="title">{{title}}</div>
        <div class="chart"><svg><defs><linearGradient id="{{__id}}-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" /><stop offset="1" stop-color="var(--accent)" stop-opacity="0" /></linearGradient></defs><g class="grid"></g><path class="area" /><path class="line" /><g class="pts"></g></svg></div>
        {{#source}}<div class="source">Nguồn: {{source}}</div>{{/source}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const box = $(".chart").getBoundingClientRect();
          const W = box.width || 1620, H = box.height || 520;
          const vals = (P.values || []).map(Number);
          const n = vals.length;
          const lo = Math.min(0, ...vals), hi = Math.max(...vals, 0.0001);
          const padT = 70, padB = 56, padX = 60;
          const x = (i) => padX + ((W - 2 * padX) * i) / Math.max(1, n - 1);
          const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1));
          const NS = "http://www.w3.org/2000/svg";
          const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
          for (let g = 0; g <= 3; g++) mk("line", { x1: 0, x2: W, y1: padT + ((H - padT - padB) * g) / 3, y2: padT + ((H - padT - padB) * g) / 3 }, $(".grid"));
          const d = vals.map((v, i) => (i ? "L" : "M") + x(i) + " " + y(v)).join(" ");
          $(".line").setAttribute("d", d);
          $(".area").setAttribute("d", d + " L" + x(n - 1) + " " + (H - padB) + " L" + x(0) + " " + (H - padB) + " Z");
          const dec = vals.some((v) => !Number.isInteger(v)) ? 1 : 0;
          const fmt = (v) => v.toLocaleString("vi-VN", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + (P.unit || "");
          const pts = vals.map((v, i) => {
          const last = i === n - 1 ? " last" : "";
          const c = mk("circle", { class: "pt" + last, cx: x(i), cy: y(v), r: last ? 16 : 11 }, $(".pts"));
          c.style.transformBox = "fill-box";
          c.style.transformOrigin = "center";
          const t = mk("text", { class: "val" + last, x: x(i), y: y(v) - (last ? 34 : 26) }, $(".pts"));
          t.textContent = fmt(v);
          const l = mk("text", { class: "lab", x: x(i), y: H - 8 }, $(".pts"));
          l.textContent = P.labels[i] || "";
          return [c, t, l];
          });
          const len = $(".line").getTotalLength();
          $(".line").style.strokeDasharray = len;
          tl.fromTo($(".title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo($$(".grid line"), { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.05 }, 0.2);
          tl.fromTo($$(".lab"), { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.06 }, 0.3);
          const draw = Math.min(2.6, Math.max(1.2, P.D * 0.35));
          tl.fromTo($(".line"), { strokeDashoffset: len }, { strokeDashoffset: 0, duration: draw, ease: "power1.inOut" }, 0.6);
          tl.fromTo($(".area"), { opacity: 0 }, { opacity: 0.5, duration: 0.8 }, 0.6 + draw * 0.6);
          pts.forEach(([c, t], i) => {
          const when = 0.6 + (draw * i) / Math.max(1, n - 1);
          tl.fromTo(c, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, when);
          tl.fromTo(t, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, when + 0.05);
          });
          if ($(".source")) tl.fromTo($(".source"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6 + draw);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
