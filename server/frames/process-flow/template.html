<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 130px; right: 130px; top: 90px; bottom: 280px; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
        {{__r}} .title { font-size: 72px; line-height: 1.1; }
        {{__r}} .flow { display: flex; align-items: center; }
        {{__r}} .node { flex: 1; min-height: 210px; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 30px 32px; border-radius: 24px; background: var(--panel); border: 3px solid var(--accent); text-align: center; }
        {{__r}} .num { font-size: 28px; color: var(--accent); }
        {{__r}} .label { font-size: 42px; line-height: 1.25; }
        {{__r}} .arrow { flex: none; position: relative; width: 110px; height: 14px; margin: 0 6px; }
        {{__r}} .arrow:first-child { display: none; }
        {{__r}} .arrow i { position: absolute; left: 0; right: 26px; top: 3px; height: 8px; border-radius: 4px; background: var(--accent2); }
        {{__r}} .arrow b { position: absolute; right: 0; top: -12px; width: 38px; height: 38px; background: var(--accent2); clip-path: polygon(0 0, 100% 50%, 0 100%); }
        {{__r}} .caption { font-size: 38px; color: var(--muted); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="title">{{title}}</div>
        <div class="flow">
        {{#nodes}}<div class="arrow"><i></i><b></b></div><div class="node"><div class="num">BƯỚC {{@n}}</div><div class="label">{{.}}</div></div>{{/nodes}}
        </div>
        {{#caption}}<div class="caption">{{caption}}</div>{{/caption}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".title"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          const nodes = $$(".node");
          const arrows = $$(".arrow").slice(1);
          let last = 0.3;
          nodes.forEach((el, i) => {
          const t = Math.max(last + 0.35, at(i, nodes.length) - 0.1);
          last = t;
          if (i > 0) tl.fromTo(arrows[i - 1], { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, t - 0.25);
          tl.fromTo(el, { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t);
          });
          if ($(".caption")) tl.fromTo($(".caption"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, last + 0.5);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
