<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 130px; right: 140px; top: 90px; bottom: 270px; display: flex; align-items: center; gap: 90px; }
        {{__r}} .art { position: relative; flex: none; width: 520px; height: 520px; display: flex; align-items: center; justify-content: center; }
        {{__r}} .blob { position: absolute; inset: 20px; border-radius: 46% 54% 52% 48% / 50% 44% 56% 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 0.22; }
        {{__r}} .shadow { position: absolute; left: 130px; right: 130px; bottom: 30px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.18); filter: blur(10px); }
        {{__r}} .ico { position: relative; width: 400px; height: 400px; }
        {{__r}} .text { flex: 1; display: flex; flex-direction: column; gap: 30px; }
        {{__r}} .title { font-size: 84px; line-height: 1.1; }
        {{__r}} .subtitle { font-size: 46px; line-height: 1.35; color: var(--muted); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="art"><div class="blob"></div><div class="shadow"></div><img class="ico" src="assets/icons/{{icon}}.svg" alt="" /></div>
        <div class="text">
        <div class="title">{{title}}</div>
        {{#subtitle}}<div class="subtitle">{{subtitle}}</div>{{/subtitle}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".blob"), { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.5)" }, 0.05);
          tl.fromTo($(".ico"), { y: -380, scale: 0.6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "bounce.out" }, 0.15);
          tl.fromTo($(".shadow"), { scaleX: 0.3, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.75, ease: "bounce.out" }, 0.15);
          tl.fromTo($(".title"), { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.45);
          if ($(".subtitle")) tl.fromTo($(".subtitle"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.75);
          const sways = Math.max(1, Math.floor((P.D - 1.8) / 1.4));
          tl.to($(".ico"), { rotation: 5, duration: 0.7, yoyo: true, repeat: sways * 2 - 1, ease: "sine.inOut" }, 1.1);
          tl.to($(".blob"), { rotation: 25, duration: P.D - 1, ease: "none" }, 0.85);
          tl.to($(".wrap"), { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
