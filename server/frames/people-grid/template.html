<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 140px; right: 140px; top: 90px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; gap: 50px; }
        {{__r}} .head { display: flex; align-items: baseline; gap: 30px; }
        {{__r}} .big { font-size: 150px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
        {{__r}} .big small { font-size: 70px; color: var(--muted); }
        {{__r}} .label { font-size: 58px; line-height: 1.2; flex: 1; }
        {{__r}} .row { display: flex; justify-content: space-between; }
        {{__r}} .p { position: relative; width: 130px; height: 250px; }
        {{__r}} .p i { position: absolute; left: 32px; top: 0; width: 66px; height: 66px; border-radius: 50%; background: var(--line); }
        {{__r}} .p b { position: absolute; left: 10px; top: 80px; width: 110px; height: 170px; border-radius: 55px 55px 18px 18px; background: var(--line); }
        {{__r}} .hi { position: absolute; inset: 0; opacity: 0; }
        {{__r}} .hi i, .hi b { background: linear-gradient(160deg, var(--accent), var(--accent2)); }
        {{__r}} .source { font-size: 28px; color: var(--muted); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="head"><div class="big"><span>0</span><small>/10</small></div><div class="label">{{label}}</div></div>
        <div class="row"><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div><div class="p"><i></i><b></b><div class="hi"><i></i><b></b></div></div></div>
        {{#source}}<div class="source">Nguồn: {{source}}</div>{{/source}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const n = Math.max(0, Math.min(10, Math.round(Number(P.value) || 0)));
          const ps = $$(".p");
          const big = $(".big span");
          tl.fromTo($(".label"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
          tl.fromTo($(".big"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.1);
          tl.fromTo(ps, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }, 0.3);
          const t = Math.min(P.D - 1.5, Math.max(1, (P.marks[0] ?? P.vo + 0.4) - 0.1));
          ps.slice(0, n).forEach((el, i) => {
          tl.fromTo(el.querySelector(".hi"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + i * 0.12);
          tl.fromTo(el, { scale: 1 }, { scale: 1.15, duration: 0.12, yoyo: true, repeat: 1 }, t + i * 0.12);
          });
          const c = { v: 0 };
          tl.fromTo(c, { v: 0 }, { v: n, duration: Math.max(0.2, n * 0.12), ease: "none", onUpdate: () => (big.textContent = Math.round(c.v)) }, t);
          if ($(".source")) tl.fromTo($(".source"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
