<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 80px; bottom: 270px; display: flex; align-items: center; gap: 100px; }
        {{__r}} .map { position: relative; flex: none; width: 520px; height: 600px; }
        {{__r}} .globe { position: absolute; left: 40px; right: 40px; bottom: 0; height: 200px; border-radius: 50%; background: var(--panel); border: 3px solid var(--line); }
        {{__r}} .ripple { position: absolute; left: 50%; bottom: 80px; width: 200px; height: 70px; margin-left: -100px; border-radius: 50%; border: 4px solid var(--accent); }
        {{__r}} .pin { position: absolute; left: 50%; bottom: 105px; width: 340px; height: 340px; margin-left: -170px; border-radius: 50% 50% 50% 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); transform: rotate(-45deg); box-shadow: -14px 14px 40px rgba(0, 0, 0, 0.25); }
        {{__r}} .pin .in { position: absolute; inset: 40px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; transform: rotate(45deg); }
        {{__r}} .pin img { width: 190px; height: 190px; }
        {{__r}} .text { flex: 1; display: flex; flex-direction: column; gap: 22px; }
        {{__r}} .place { font-size: 92px; line-height: 1.05; }
        {{__r}} .country { font-size: 44px; color: var(--accent); }
        {{__r}} .facts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
        {{__r}} .f { padding: 16px 28px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); font-size: 38px; }
        /* Tall formats: stack the visual above the text. */
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .wrap { flex-direction: column; justify-content: center; gap: 60px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .text { flex: none; align-self: stretch; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="map"><div class="globe"></div><div class="ripple"></div><div class="pin"><div class="in">{{#icon}}<img class="pi" src="assets/icons/{{icon}}.svg" alt="" />{{/icon}}</div></div></div>
        <div class="text">
        <div class="place">{{place}}</div>
        {{#country}}<div class="country">📍 {{country}}</div>{{/country}}
        {{?facts}}<div class="facts">{{#facts}}<div class="f">{{.}}</div>{{/facts}}</div>{{/?facts}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".globe"), { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.05);
          tl.fromTo($(".pin"), { y: -700, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "bounce.out" }, 0.2);
          tl.fromTo($(".ripple"), { scale: 0.3, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.9, ease: "power2.out" }, 0.55);
          tl.fromTo($(".place"), { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.5);
          if ($(".country")) tl.fromTo($(".country"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5 }, 0.75);
          const fs = $$(".f");
          let last = 0.9;
          fs.forEach((el, i) => {
          const t = Math.max(last + 0.25, at(i, fs.length) - 0.1);
          last = t;
          tl.fromTo(el, { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
