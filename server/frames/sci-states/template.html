<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 110px; right: 110px; top: 80px; bottom: 280px; display: flex; align-items: center; gap: 70px; }
        {{__r}} .viz { position: relative; flex: none; width: 1000px; height: 680px; }
        {{__r}} .stage { position: absolute; left: 0; top: 0; width: 1000px; height: 680px; transform-origin: 0 0; }
        {{__r}} .stage > svg { position: absolute; inset: 0; overflow: visible; }
        {{__r}} .layer { position: absolute; inset: 0; }
        {{__r}} .stage text { fill: var(--ink); font-size: 30px; }
        {{__r}} .stage text.sm { font-size: 25px; fill: var(--muted); }
        {{__r}} .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
        {{__r}} .title { font-size: 60px; line-height: 1.12; }
        {{__r}} .tag { align-self: flex-start; padding: 12px 26px; border-radius: 18px; background: var(--panel); border: 3px solid var(--accent); font-size: 44px; }
        {{__r}} .notes { display: flex; flex-direction: column; gap: 16px; }
        {{__r}} .note { display: flex; gap: 18px; align-items: baseline; font-size: 34px; line-height: 1.3; }
        {{__r}} .note b { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent2); translate: 0 -5px; }
        {{__r}} .caption { font-size: 30px; line-height: 1.35; color: var(--muted); padding-top: 16px; border-top: 3px solid var(--line); }
        /* Other formats: the drawing keeps its 1000×680 design and is scaled; tall ones stack it above the text. */
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .wrap { flex-direction: column; justify-content: center; gap: 40px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .side { flex: none; align-self: stretch; }
        {{__r}}[data-aspect="9x16"] .viz { width: 1130px; height: 768px; }
        {{__r}}[data-aspect="9x16"] .stage { scale: 1.13; }
        {{__r}}[data-aspect="4x5"] .viz { width: 1280px; height: 870px; }
        {{__r}}[data-aspect="4x5"] .stage { scale: 1.28; }
        {{__r}}[data-aspect="1x1"] .viz { width: 760px; height: 517px; }
        {{__r}}[data-aspect="1x1"] .stage { scale: 0.76; }
        {{__r}} .box { fill: var(--panel); stroke: var(--line); stroke-width: 5; }
        {{__r}} .tarc { fill: none; stroke: var(--accent2); stroke-width: 6; stroke-linecap: round; }
        {{__r}} .thead { fill: var(--accent2); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="viz"><div class="stage"><svg viewBox="0 0 1000 680" width="1000" height="680"></svg><div class="layer"></div></div></div>
        <div class="side">
        {{#title}}<div class="title">{{title}}</div>{{/title}}
        {{?notes}}<div class="notes">{{#notes}}<div class="note"><b></b><span>{{.}}</span></div>{{/notes}}</div>{{/?notes}}
        {{#caption}}<div class="caption">{{caption}}</div>{{/caption}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for keyword i of n: when it is spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          // New SVG element under parent; T adds a text.
          const S = (tag, attrs, parent) => {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
            for (const k in attrs) el.setAttribute(k, attrs[k]);
            parent.appendChild(el);
            return el;
          };
          const T = (x, y, text, cls, parent, extra = {}) => {
            const el = S("text", { x, y, class: cls, ...extra }, parent);
            el.textContent = text;
            return el;
          };
          // Continuous motion (orbits, waves, flowing particles): f(t) runs whenever the timeline renders, so seeking stays exact.
          const clock = (f) => {
            const c = { t: 0 };
            f(0);
            tl.fromTo(c, { t: 0 }, { t: P.D, duration: P.D, ease: "none", onUpdate: () => f(c.t) }, 0);
          };
          // Draws a line or path from its start, like a pen.
          const draw = (el, t, duration = 0.7) => {
            const len = el.getTotalLength();
            tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration, ease: "power2.inOut" }, t);
          };
          // Pops an element in; origin = "x y" in SVG units for SVG elements.
          const pop = (el, t, origin) => {
            const o = origin ? { svgOrigin: origin } : {};
            tl.fromTo(el, { opacity: 0, scale: 0, ...o }, { opacity: 1, scale: 1, ...o, duration: 0.5, ease: "back.out(1.7)" }, t);
          };
          const svg = $(".stage svg");
          const nNotes = $$(".note").length;
          // Notes come in at keywords k, k+1… of n.
          const notesAt = (k, n) => $$(".note").forEach((el, i) => tl.fromTo(el, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at(k + i, n)));
          if ($(".title")) tl.fromTo($(".title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          const KIND = { solid: "Rắn", liquid: "Lỏng", gas: "Khí" };
          const COL = { solid: "#4C9AFF", liquid: "#2EC4B6", gas: "#FF8C42" };
          const st = (P.states || []).slice(0, 3).map((s) => (KIND[s] ? s : "solid"));
          const n = st.length, GAP = 130, H = 340, TOP = 170;
          const W = Math.min(270, (960 - (n - 1) * GAP) / n);
          const left = (1000 - (n * W + (n - 1) * GAP)) / 2;
          const N = n + nNotes;
          const tri = (u) => 1 - Math.abs((((u % 2) + 2) % 2) - 1);
          const boxes = st.map((s, i) => {
            const bx = left + i * (W + GAP);
            const g = S("g", {}, svg);
            S("rect", { x: bx, y: TOP, width: W, height: H, rx: 22, class: "box" }, g);
            T(bx + W / 2, TOP + H + 60, P.labels?.[i] || KIND[s], "", g, { "text-anchor": "middle" });
            // Each particle is a function of time: solids shiver in a lattice, liquids slide, gases bounce off the walls.
            const parts = [];
            const sp = (W - 40) / 6;
            if (s === "solid")
              for (let r = 0; r < 5; r++)
                for (let c = 0; c < 6; c++) parts.push((t, k) => [bx + 20 + sp * (c + 0.5) + 2.5 * Math.sin(t * 11 + k), TOP + H - 20 - sp * (r + 0.5) + 2.5 * Math.cos(t * 13 + k * 1.7)]);
            if (s === "liquid")
              for (let r = 0; r < 4; r++)
                for (let c = 0; c < 6; c++) parts.push((t, k) => [bx + 20 + sp * (c + 0.3 + (r % 2) * 0.4) + 12 * Math.sin(t * 1.6 + k * 2.1), TOP + H - 26 - sp * 1.05 * (r + 0.5) + 8 * Math.sin(t * 2.2 + k * 1.3)]);
            if (s === "gas")
              for (let k = 0; k < 10; k++) parts.push((t) => [bx + 16 + (W - 32) * tri(((k * 0.37) % 1) + t * (0.32 + (k % 3) * 0.12)), TOP + 16 + (H - 32) * tri(((k * 0.61) % 1) + t * (0.26 + (k % 4) * 0.09))]);
            const dots = parts.map(() => S("circle", { r: 13, fill: COL[s] }, g));
            pop(g, at(i, N), `${bx + W / 2} ${TOP + H / 2}`);
            return { parts, dots };
          });
          (P.transitions || []).slice(0, n - 1).forEach((name, i) => {
            const x1 = left + i * (W + GAP) + W * 0.6, x2 = left + (i + 1) * (W + GAP) + W * 0.4;
            const g = S("g", {}, svg);
            S("path", { d: `M${x1},${TOP - 12} Q${(x1 + x2) / 2},${TOP - 90} ${x2},${TOP - 12}`, class: "tarc" }, g);
            S("polygon", { points: `${x2 + 4},${TOP - 4} ${x2 - 24},${TOP - 18} ${x2 - 2},${TOP - 38}`, class: "thead" }, g);
            T((x1 + x2) / 2, TOP - 68, name, "", g, { "text-anchor": "middle", style: "fill:var(--accent2)" });
            tl.fromTo(g, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, at(i + 1, N) - 0.3);
          });
          clock((t) =>
            boxes.forEach(({ parts, dots }) =>
              parts.forEach((f, k) => {
                const [x, y] = f(t, k);
                dots[k].setAttribute("cx", x.toFixed(1));
                dots[k].setAttribute("cy", y.toFixed(1));
              }),
            ),
          );
          notesAt(n, N);
          if ($(".caption")) tl.fromTo($(".caption"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, Math.max(1.2, Math.min(P.D - 1.4, (P.vo + P.voEnd) / 2)));
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
