<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 160px; right: 160px; top: 90px; bottom: 280px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
        {{__r}} .head { display: flex; align-items: baseline; gap: 28px; }
        {{__r}} .term { font-size: 96px; line-height: 1.05; color: var(--accent); }
        {{__r}} .extra { font-size: 40px; color: var(--muted); font-style: italic; }
        {{__r}} .rule { height: 4px; background: var(--line); }
        {{__r}} .meaning { font-size: 50px; line-height: 1.35; max-width: 1500px; }
        {{__r}} .example { display: flex; gap: 26px; align-items: flex-start; padding: 26px 34px; border-radius: 20px; background: var(--panel); border-left: 10px solid var(--accent2); max-width: 1500px; }
        {{__r}} .ex-label { flex: none; font-size: 30px; color: var(--accent2); letter-spacing: 0.08em; padding-top: 6px; }
        {{__r}} .ex-text { font-size: 40px; line-height: 1.35; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="head"><div class="term">{{term}}</div>{{#extra}}<div class="extra">{{extra}}</div>{{/extra}}</div>
        <div class="rule"></div>
        <div class="meaning">{{meaning}}</div>
        {{#example}}<div class="example"><div class="ex-label">VÍ DỤ</div><div class="ex-text">{{example}}</div></div>{{/example}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".term"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          if ($(".extra")) tl.fromTo($(".extra"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.45);
          tl.fromTo($(".rule"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.4);
          tl.fromTo($(".meaning"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.7);
          if ($(".example")) tl.fromTo($(".example"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, Math.min(P.D - 1.2, Math.max(1.5, P.marks[0] ?? P.vo + (P.voEnd - P.vo) * 0.55)));
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
