<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; overflow: hidden; background: #000; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; }
        {{__r}} .stage { position: absolute; inset: 0; width: 100%; height: 100%; }
        {{__r}} .board { position: absolute; left: 0; right: 0; top: 60px; margin: 0 auto; width: fit-content; min-width: 900px; max-width: 86%; padding: 34px 70px 40px; border-radius: 30px; background: #FFF6E2; border: 8px solid #8B5A2B; box-shadow: 0 16px 0 #6B4220, 0 30px 60px rgba(0, 0, 0, 0.25); text-align: center; }
        {{__r}} .kicker { font-size: 36px; color: #E07A2E; letter-spacing: 0.06em; text-transform: uppercase; }
        {{__r}} .title { margin-top: 8px; font-size: 96px; line-height: 1.05; color: #3A2A1A; }
        {{__r}}:not([data-aspect="16x9"]) .board { min-width: 0; width: 86%; padding: 30px 40px; }
        {{__r}}:not([data-aspect="16x9"]) .title { font-size: 84px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        {{{__stage}}}
        <div class="board"><div class="kicker">{{#kicker}}{{kicker}}{{/kicker}}{{^kicker}}Phim hoạt hình{{/kicker}}</div><div class="title">{{title}}</div></div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          {{{__engine}}}
          animShot(R, P, tl);
          tl.fromTo($(".board"), { y: -420, rotation: -4 }, { y: 0, rotation: 0, duration: 0.9, ease: "bounce.out" }, 0.2);
          tl.to($(".board"), { rotation: 1.5, duration: 1.2, yoyo: true, repeat: Math.max(1, Math.floor((P.D - 1.3) / 1.2)) - 1, ease: "sine.inOut" }, 1.1);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
