<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 80px; bottom: 270px; display: flex; align-items: center; gap: 90px; }
        {{__r}} .draw { position: relative; flex: none; width: 560px; height: 560px; }
        {{__r}} .c1 { position: absolute; inset: 0; border-radius: 50%; border: 3px dashed var(--accent); }
        {{__r}} .c2 { position: absolute; inset: 60px; border-radius: 50%; border: 2px solid var(--line); }
        {{__r}} .hl, .vl { position: absolute; background: var(--line); }
        {{__r}} .hl { left: -40px; right: -40px; top: 50%; height: 2px; } .vl { top: -40px; bottom: -40px; left: 50%; width: 2px; }
        {{__r}} .draw img { position: absolute; left: 130px; top: 130px; width: 300px; height: 300px; }
        {{__r}} .dim { position: absolute; left: 0; right: 0; bottom: -54px; text-align: center; font-size: 26px; color: var(--muted); letter-spacing: 0.2em; }
        {{__r}} .text { flex: 1; display: flex; flex-direction: column; gap: 22px; }
        {{__r}} .year { align-self: flex-start; font-size: 46px; color: var(--on-accent); background: var(--accent); padding: 8px 26px; border-radius: 10px; }
        {{__r}} .name { font-size: 86px; line-height: 1.06; }
        {{__r}} .inv { font-size: 42px; color: var(--accent2); }
        {{__r}} .impact { font-size: 42px; line-height: 1.3; color: var(--muted); padding-left: 26px; border-left: 6px solid var(--accent); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="draw"><div class="hl"></div><div class="vl"></div><div class="c1"></div><div class="c2"></div><img class="di" src="assets/icons/{{icon}}.svg" alt="" /><div class="dim">FIG. 1</div></div>
        <div class="text">
        {{#year}}<div class="year">{{year}}</div>{{/year}}
        <div class="name">{{name}}</div>
        {{#inventor}}<div class="inv">Người phát minh: {{inventor}}</div>{{/inventor}}
        {{#impact}}<div class="impact">{{impact}}</div>{{/impact}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo([$(".hl"), $(".vl")], { scale: 0 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 0.05);
          tl.fromTo($(".c1"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.8, ease: "power3.out" }, 0.15);
          tl.fromTo($(".c2"), { scale: 0 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.fromTo($(".di"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 0.5);
          tl.fromTo($(".dim"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
          tl.fromTo($(".c1"), { rotation: 0 }, { rotation: 60, duration: P.D - 1, ease: "none" }, 0.95);
          if ($(".year")) tl.fromTo($(".year"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45 }, 0.4);
          tl.fromTo($(".name"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.55);
          if ($(".inv")) tl.fromTo($(".inv"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.85);
          if ($(".impact")) tl.fromTo($(".impact"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6 }, 1.1);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
