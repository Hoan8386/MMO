<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 100px; right: 100px; top: 80px; bottom: 270px; display: flex; flex-direction: column; gap: 20px; }
        {{__r}} .title { font-size: 64px; }
        {{__r}} .field { position: relative; flex: 1; overflow: hidden; border-radius: 30px; background: var(--panel); }
        {{__r}} .lines { position: absolute; inset: 0; }
        {{__r}} .ln { position: absolute; height: 8px; border-radius: 4px; background: var(--line); }
        {{__r}} .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: repeating-linear-gradient(90deg, var(--line) 0 60px, transparent 60px 120px); opacity: 0.6; }
        {{__r}} .runner, .chaser { position: absolute; bottom: 40px; width: 280px; height: 280px; }
        {{__r}} .runner { left: 58%; } .chaser { left: 14%; }
        {{__r}} .runner img, .chaser img { width: 100%; height: 100%; scale: -1 1; filter: drop-shadow(0 16px 14px rgba(0, 0, 0, 0.25)); }
        {{__r}} .dust { position: absolute; bottom: 50px; width: 60px; height: 60px; border-radius: 50%; background: var(--line); }
        {{__r}} .caption { font-size: 52px; line-height: 1.2; }
        {{__r}}:not([data-aspect="16x9"]) .wrap { justify-content: center; }
        {{__r}}:not([data-aspect="16x9"]) .field { flex: none; height: 720px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .runner, TALL .chaser { width: 300px; height: 300px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .runner { left: 52%; } TALL .chaser { left: 4%; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        {{#title}}<div class="title">{{title}}</div>{{/title}}
        <div class="field">
        <div class="lines"><div class="ln" style="top: 18%; width: 300px"></div><div class="ln" style="top: 34%; width: 200px"></div><div class="ln" style="top: 50%; width: 360px"></div><div class="ln" style="top: 66%; width: 240px"></div></div>
        <div class="ground"></div>
        <div class="dust" style="left: 12%"></div><div class="dust" style="left: 56%"></div>
        <div class="chaser"><img class="hi" src="assets/characters/{{chaser}}.svg" alt="" /></div>
        <div class="runner"><img class="ri" src="assets/characters/{{runner}}.svg" alt="" /></div>
        </div>
        <div class="caption">{{caption}}</div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const W = $(".field").offsetWidth || 1700;
          if ($(".title")) tl.fromTo($(".title"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo($(".field"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0);
          // Speed lines and the ground stream right to left for the whole scene.
          $$(".ln").forEach((el, i) => tl.fromTo(el, { x: W + 100 }, { x: -500, duration: 0.7 + i * 0.12, repeat: Math.ceil(P.D / 0.7), ease: "none" }, i * 0.15));
          tl.fromTo($(".ground"), { backgroundPositionX: 0 }, { backgroundPositionX: -120 * Math.ceil(P.D * 3), duration: P.D, ease: "none" }, 0);
          // Both run in from the left; the chaser gains ground slowly.
          tl.fromTo($(".runner"), { x: -900 }, { x: 0, duration: 0.8, ease: "power3.out" }, 0.2);
          tl.fromTo($(".chaser"), { x: -900 }, { x: 0, duration: 0.8, ease: "power3.out" }, 0.45);
          tl.to($(".chaser"), { x: 140, duration: Math.max(0.5, P.D - 1.8), ease: "sine.inOut" }, 1.25);
          const steps = Math.ceil(P.D / 0.36);
          tl.fromTo($(".runner img"), { y: 0 }, { y: -36, duration: 0.18, yoyo: true, repeat: steps * 2, ease: "power1.out" }, 0.2);
          tl.fromTo($(".chaser img"), { y: 0 }, { y: -36, duration: 0.18, yoyo: true, repeat: steps * 2, ease: "power1.out" }, 0.29);
          $$(".dust").forEach((d, i) => tl.fromTo(d, { scale: 0.2, opacity: 0.8, x: 0 }, { scale: 2, opacity: 0, x: -160, duration: 0.6, repeat: Math.ceil(P.D / 0.6), ease: "power1.out" }, 0.4 + i * 0.3));
          tl.fromTo($(".caption"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.7);
          tl.to($(".wrap"), { opacity: 0, x: 60, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
