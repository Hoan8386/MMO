<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .bar { position: absolute; left: 0; right: 0; height: 130px; background: #000; }
        {{__r}} .bar.top { top: 0; } .bar.bot { bottom: 0; }
        {{__r}} .wrap { position: absolute; left: 200px; right: 200px; top: 160px; bottom: 300px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
        {{__r}} .ch { display: flex; align-items: center; gap: 24px; font-size: 40px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; }
        {{__r}} .ch i { display: block; height: 4px; width: 160px; background: var(--accent); }
        {{__r}} .title { font-size: 120px; line-height: 1.04; }
        {{__r}} .when { font-size: 40px; color: var(--muted); font-style: italic; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="ch"><span>{{chapter}}</span><i></i></div>
        <div class="title">{{title}}</div>
        {{#when}}<div class="when">{{when}}</div>{{/when}}
        </div>
        <div class="bar top"></div><div class="bar bot"></div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo([$(".bar.top"), $(".bar.bot")], { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo($(".ch span"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5 }, 0.25);
          tl.fromTo($(".ch i"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.35);
          tl.fromTo($(".title"), { opacity: 0, y: 30, clipPath: "inset(0 0 100% 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0 0% 0)", duration: 0.8, ease: "power3.out" }, 0.5);
          if ($(".when")) tl.fromTo($(".when"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1);
          tl.fromTo($(".title"), { scale: 1 }, { scale: 1.03, duration: P.D, ease: "none" }, 0);
          tl.to($(".wrap"), { opacity: 0, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
