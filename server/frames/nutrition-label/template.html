<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 80px; bottom: 270px; display: flex; align-items: center; gap: 90px; }
        {{__r}} .food { flex: none; width: 520px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        {{__r}} .plate { width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, var(--bg2) 55%, var(--panel) 56%, var(--panel) 68%, var(--bg2) 69%); border: 4px solid var(--line); display: flex; align-items: center; justify-content: center; }
        {{__r}} .plate img { width: 260px; height: 260px; }
        {{__r}} .fname { font-size: 62px; }
        {{__r}} .kcal { font-size: 40px; color: var(--accent2); }
        {{__r}} .label { flex: 1; padding: 34px 44px; border: 6px solid var(--ink); border-radius: 20px; background: var(--bg2); }
        {{__r}} .lt { font-size: 52px; border-bottom: 12px solid var(--ink); padding-bottom: 10px; }
        {{__r}} .sv { font-size: 30px; color: var(--muted); padding: 12px 0; border-bottom: 4px solid var(--ink); }
        {{__r}} .nr { display: grid; grid-template-columns: 220px 1fr 130px; align-items: center; gap: 20px; padding: 16px 0; border-bottom: 2px solid var(--line); font-size: 38px; }
        {{__r}} .nr .bar { height: 26px; border-radius: 13px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transform-origin: left center; }
        {{__r}} .nr .g { text-align: right; font-variant-numeric: tabular-nums; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="food"><div class="plate"><img class="fi" src="assets/icons/{{icon}}.svg" alt="" /></div><div class="fname">{{food}}</div>{{#calories}}<div class="kcal"><span>0</span> kcal</div>{{/calories}}</div>
        <div class="label">
        <div class="lt">Thành phần dinh dưỡng</div>
        {{#serving}}<div class="sv">Khẩu phần: {{serving}}</div>{{/serving}}
        {{#labels}}<div class="nr"><div>{{.}}</div><div><div class="bar"></div></div><div class="g"></div></div>{{/labels}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const rows = $$(".nr");
          const vals = rows.map((_, i) => Math.max(0, Number(P.values[i]) || 0));
          const max = Math.max(...vals, 0.0001);
          tl.fromTo($(".plate"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.5)" }, 0.05);
          tl.fromTo($(".fi"), { scale: 0, y: -60 }, { scale: 1, y: 0, duration: 0.6, ease: "back.out(2)" }, 0.4);
          tl.fromTo($(".fname"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 0.6);
          if ($(".kcal")) {
          const k = $(".kcal span"), c = { v: 0 };
          tl.fromTo($(".kcal"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.8);
          tl.fromTo(c, { v: 0 }, { v: Number(P.calories) || 0, duration: 1.2, ease: "power2.out", onUpdate: () => (k.textContent = Math.round(c.v).toLocaleString("vi-VN")) }, 0.8);
          }
          tl.fromTo($(".label"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          rows.forEach((r, i) => {
          r.querySelector(".bar").style.width = Math.max(2, (100 * vals[i]) / max) + "%";
          r.querySelector(".g").textContent = vals[i].toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " g";
          tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.9 + i * 0.25);
          tl.fromTo(r.querySelector(".bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 1 + i * 0.25);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
