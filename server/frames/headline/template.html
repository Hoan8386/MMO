<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 140px; right: 140px; top: 110px; bottom: 280px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
        {{__r}} .label { align-self: flex-start; padding: 10px 22px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; }
        {{__r}} .title { font-size: 92px; line-height: 1.12; max-width: 1600px; }
        {{__r}} .rule { width: 100%; max-width: 1600px; height: 4px; background: var(--line); position: relative; overflow: hidden; }
        {{__r}} .rule i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
        {{__r}} .subtitle { font-size: 44px; line-height: 1.35; color: var(--muted); max-width: 1500px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
          {{#label}}<div class="label">{{label}}</div>{{/label}}
          <div class="title">{{title}}</div>
          <div class="rule"><i></i></div>
          {{#subtitle}}<div class="subtitle">{{subtitle}}</div>{{/subtitle}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          if ($(".label")) tl.fromTo($(".label"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo($(".title"), { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.2);
          tl.fromTo($(".rule i"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 1, ease: "power2.inOut" }, 0.45);
          const subAt = Math.min(P.D - 1.2, Math.max(0.8, P.marks[0] ?? P.vo + 1.2));
          if ($(".subtitle")) tl.fromTo($(".subtitle"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, subAt);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
