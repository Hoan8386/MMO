<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 120px; right: 120px; top: 70px; bottom: 270px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
        {{__r}} .row { display: flex; align-items: center; gap: 50px; }
        {{__r}} .who { width: 400px; height: 400px; }
        {{__r}} .who img { width: 100%; height: 100%; filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.22)); }
        {{__r}} .moods { display: flex; align-items: center; gap: 30px; }
        {{__r}} .m { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        {{__r}} .face { width: 210px; height: 210px; border-radius: 50%; background: var(--panel); border: 4px solid var(--line); display: flex; align-items: center; justify-content: center; }
        {{__r}} .face img { width: 160px; height: 160px; }
        {{__r}} .m.after .face { border-color: var(--accent); box-shadow: 0 0 50px var(--glow); }
        {{__r}} .ml { font-size: 36px; }
        {{__r}} .m.after .ml { color: var(--accent); }
        {{__r}} .arrow { font-size: 80px; color: var(--accent2); }
        {{__r}} .caption { font-size: 52px; text-align: center; max-width: 1400px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .row { flex-direction: column; gap: 30px; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="row">
        <div class="who"><img class="ci" src="assets/characters/{{character}}.svg" alt="" /></div>
        <div class="moods">
        <div class="m before"><div class="face"><img class="bi" src="assets/characters/{{before}}.svg" alt="" /></div>{{#before_label}}<div class="ml">{{before_label}}</div>{{/before_label}}</div>
        <div class="arrow">➜</div>
        <div class="m after"><div class="face"><img class="ai" src="assets/characters/{{after}}.svg" alt="" /></div>{{#after_label}}<div class="ml">{{after_label}}</div>{{/after_label}}</div>
        </div>
        </div>
        {{#caption}}<div class="caption">{{caption}}</div>{{/caption}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const turn = Math.min(P.D - 1.4, Math.max(1.3, (P.marks[0] ?? P.vo + (P.voEnd - P.vo) * 0.5) - 0.1));
          tl.fromTo($(".who"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.05);
          tl.fromTo($(".m.before"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);
          tl.fromTo($(".arrow"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, turn - 0.35);
          tl.fromTo($(".m.after"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.2)" }, turn);
          // At the change the character jolts.
          tl.fromTo($(".who"), { y: 0, rotation: 0 }, { y: -50, rotation: -6, duration: 0.15, yoyo: true, repeat: 3, ease: "power1.inOut" }, turn);
          tl.to($(".m.before"), { opacity: 0.45, duration: 0.3 }, turn);
          if ($(".caption")) tl.fromTo($(".caption"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, turn + 0.3);
          tl.to($(".wrap"), { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
