<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 180px; right: 180px; top: 70px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
        {{__r}} .win { border-radius: 24px; overflow: hidden; background: #0B1020; border: 2px solid rgba(255, 255, 255, 0.12); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
        {{__r}} .bar { display: flex; align-items: center; gap: 14px; padding: 18px 26px; background: #151C33; color: #9AA6BF; font-size: 26px; }
        {{__r}} .bar i { width: 18px; height: 18px; border-radius: 50%; background: #FF5F57; }
        {{__r}} .bar i:nth-child(2) { background: #FEBC2E; }
        {{__r}} .bar i:nth-child(3) { background: #28C840; margin-right: 14px; }
        {{__r}} .lang { margin-left: auto; color: #3DD6F5; }
        {{__r}} .code { padding: 26px 36px 30px; font-family: monospace; font-size: 40px; line-height: 1.45; color: #E6EDF3; }
        {{__r}} .ln { white-space: pre; }
        {{__r}} .ln.cm { color: #7EE787; }
        {{__r}} .caption { font-size: 38px; color: var(--muted); text-align: center; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="win">
        <div class="bar"><i></i><i></i><i></i><span>{{title}}</span>{{#lang}}<span class="lang">{{lang}}</span>{{/lang}}</div>
        <div class="code">{{#lines}}<div class="ln">{{.}}</div>{{/lines}}</div>
        </div>
        {{#caption}}<div class="caption">{{caption}}</div>{{/caption}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const lines = $$(".ln");
          lines.forEach((el) => /^\s*(#|\/\/)/.test(el.textContent) && el.classList.add("cm"));
          tl.fromTo($(".win"), { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.05);
          // "Typing": each line is unmasked left to right, spread across the narration.
          const span = Math.max(1.2, Math.min(P.voEnd, P.D - 1.2) - 0.6);
          lines.forEach((el, i) => {
          const t = 0.6 + (span * i) / lines.length;
          const d = Math.min(0.7, Math.max(0.2, el.textContent.length * 0.02));
          tl.fromTo(el, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "steps(" + Math.max(4, el.textContent.length) + ")" }, t);
          });
          if ($(".caption")) tl.fromTo($(".caption"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, Math.min(P.D - 1, 0.6 + span));
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
