<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 80px; bottom: 280px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
        {{__r}} .q { font-size: 62px; line-height: 1.25; max-width: 1550px; }
        {{__r}} .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 30px; }
        {{__r}} .opt { position: relative; display: flex; align-items: center; gap: 24px; padding: 22px 30px; border-radius: 20px; background: var(--panel); border: 3px solid var(--line); font-size: 40px; line-height: 1.25; }
        {{__r}} .letter { flex: none; width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--accent); color: var(--on-accent); font-size: 32px; }
        {{__r}} .hit { position: absolute; inset: -3px; border-radius: 20px; background: var(--accent2); opacity: 0; }
        {{__r}} .opt > span:not(.letter) { position: relative; }
        {{__r}} .letter { position: relative; }
        {{__r}} .explain { font-size: 38px; color: var(--muted); line-height: 1.35; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="q">{{question}}</div>
        <div class="opts">
        {{#options}}<div class="opt"><div class="hit"></div><span class="letter"></span><span class="txt">{{.}}</span></div>{{/options}}
        </div>
        {{#explanation}}<div class="explain">{{explanation}}</div>{{/explanation}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const opts = $$(".opt");
          opts.forEach((el, i) => (el.querySelector(".letter").textContent = "ABCD"[i]));
          const right = opts[Math.min(opts.length, Math.max(1, Math.round(P.answer))) - 1];
          tl.fromTo($(".q"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo(opts, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.12, ease: "power2.out" }, 0.5);
          const reveal = Math.min(P.D - 1.3, Math.max(1.8, P.marks[0] ?? P.voEnd - 1.8));
          tl.to(opts.filter((o) => o !== right), { opacity: 0.35, duration: 0.4 }, reveal);
          tl.to(right.querySelector(".hit"), { opacity: 1, duration: 0.3 }, reveal);
          tl.to(right, { color: "#FFFFFF", duration: 0.3 }, reveal);
          tl.fromTo(right, { scale: 1 }, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, reveal + 0.05);
          if ($(".explain")) tl.fromTo($(".explain"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, reveal + 0.4);
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
