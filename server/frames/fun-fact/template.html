<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 0; right: 0; top: 80px; bottom: 270px; display: flex; align-items: center; justify-content: center; }
        {{__r}} .card { position: relative; width: 1380px; padding: 80px 90px 64px; border-radius: 36px; background: var(--panel); border: 5px solid var(--accent); box-shadow: 16px 16px 0 var(--accent2); }
        {{__r}} .bang { position: absolute; left: -46px; top: -56px; width: 124px; height: 124px; border-radius: 50%; background: var(--accent2); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: 84px; line-height: 1; }
        {{__r}} .label { font-size: 40px; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 22px; }
        {{__r}} .fact { font-size: 66px; line-height: 1.25; }
        {{__r}} .source { margin-top: 26px; font-size: 28px; color: var(--muted); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="card">
        <div class="bang">!</div>
        <div class="label">{{#label}}{{label}}{{/label}}{{^label}}Bạn có biết?{{/label}}</div>
        <div class="fact">{{fact}}</div>
        {{#source}}<div class="source">Nguồn: {{source}}</div>{{/source}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".card"), { opacity: 0, scale: 0.8, rotation: -8 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.7, ease: "back.out(1.6)" }, 0.05);
          tl.fromTo($(".bang"), { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.5)" }, 0.45);
          tl.fromTo($(".bang"), { rotation: 0 }, { rotation: 12, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1);
          tl.fromTo($(".label"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4 }, 0.55);
          tl.fromTo($(".fact"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.7);
          if ($(".source")) tl.fromTo($(".source"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.2);
          tl.to($(".wrap"), { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
