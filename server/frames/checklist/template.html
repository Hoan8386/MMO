<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 240px; right: 240px; top: 90px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
        {{__r}} .title { font-size: 72px; line-height: 1.12; }
        {{__r}} .paper { padding: 40px 50px; border-radius: 28px; background: var(--panel); border: 2px solid var(--line); display: flex; flex-direction: column; gap: 26px; }
        {{__r}} .row { display: flex; align-items: center; gap: 30px; font-size: 48px; line-height: 1.2; }
        {{__r}} .box { position: relative; flex: none; width: 70px; height: 70px; border-radius: 16px; border: 5px solid var(--accent); }
        {{__r}} .box svg { position: absolute; left: 4px; top: 2px; width: 56px; height: 56px; }
        {{__r}} .box path { fill: none; stroke: var(--accent2); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; }
        {{__r}} .txt { position: relative; }
        {{__r}} .txt i { position: absolute; left: 0; right: 0; top: 55%; height: 4px; background: var(--muted); opacity: 0.5; transform-origin: left center; transform: scaleX(0); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="title">{{title}}</div>
        <div class="paper">
        {{#items}}<div class="row"><div class="box"><svg viewBox="0 0 56 56"><path d="M8 30 L22 44 L50 12" /></svg></div><div class="txt">{{.}}</div></div>{{/items}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo($(".paper"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25);
          const rows = $$(".row");
          tl.fromTo(rows, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.12 }, 0.45);
          let last = 0.8;
          rows.forEach((el, i) => {
          const t = Math.max(last + 0.3, at(i, rows.length));
          last = t;
          tl.fromTo(el.querySelector(".box"), { scale: 1 }, { scale: 1.18, duration: 0.15, yoyo: true, repeat: 1 }, t);
          tl.fromTo(el.querySelector("path"), { strokeDashoffset: 80 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t);
          });
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
