<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 170px; right: 170px; top: 100px; bottom: 280px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
        {{__r}} .top { display: flex; align-items: center; gap: 22px; }
        {{__r}} .pill { padding: 10px 24px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 30px; letter-spacing: 0.1em; }
        {{__r}} .subject { font-size: 36px; color: var(--muted); }
        {{__r}} .title { font-size: 92px; line-height: 1.12; max-width: 1500px; }
        {{__r}} .rule { width: 260px; height: 8px; border-radius: 4px; background: var(--accent2); }
        {{__r}} .goals { display: flex; flex-direction: column; gap: 14px; }
        {{__r}} .goal { display: flex; align-items: center; gap: 20px; font-size: 38px; }
        {{__r}} .box { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 4px solid var(--accent2); }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="top"><div class="pill">BÀI HỌC</div><div class="subject">{{subject}}</div></div>
        <div class="title">{{title}}</div>
        <div class="rule"></div>
        {{?goals}}<div class="goals">{{#goals}}<div class="goal"><span class="box"></span><span>{{.}}</span></div>{{/goals}}</div>{{/?goals}}
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          tl.fromTo($(".pill"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          tl.fromTo($(".subject"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5 }, 0.25);
          tl.fromTo($(".title"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.35);
          tl.fromTo($(".rule"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.7);
          $$(".goal").forEach((el, i, all) => tl.fromTo(el, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, Math.max(1.1 + i * 0.25, at(i, all.length))));
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
