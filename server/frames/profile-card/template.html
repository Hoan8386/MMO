<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        {{{__fontface}}}
        {{__r}} { position: absolute; inset: 0; font-family: "Be Vietnam Pro", sans-serif; font-weight: 600; color: var(--ink); }
        {{__r}} .wrap { position: absolute; left: 150px; right: 150px; top: 90px; bottom: 280px; display: flex; align-items: center; gap: 90px; }
        {{__r}} .avatar { position: relative; flex: none; width: 460px; height: 460px; }
        {{__r}} .ring { position: absolute; inset: -22px; border-radius: 50%; border: 6px dashed var(--accent); }
        {{__r}} .pic { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; }
        {{__r}} .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
        {{__r}} .ini { font-size: 170px; color: var(--on-accent); letter-spacing: -0.02em; }
        {{__r}} .info { display: flex; flex-direction: column; gap: 22px; }
        {{__r}} .name { font-size: 92px; line-height: 1.05; }
        {{__r}} .role { font-size: 42px; color: var(--accent); }
        {{__r}} .facts { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }
        {{__r}} .fact { display: flex; gap: 18px; align-items: baseline; font-size: 38px; line-height: 1.3; color: var(--muted); }
        {{__r}} .fact b { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent2); }
        /* Tall formats: stack the visual above the text. */
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .wrap { flex-direction: column; justify-content: center; gap: 60px; }
        {{__r}}:is([data-aspect="9x16"], [data-aspect="4x5"]) .text { flex: none; align-self: stretch; }
      </style>
      <div id="{{__id}}-root" data-composition-id="{{__id}}" data-width="{{__w}}" data-height="{{__h}}">
        <div class="wrap">
        <div class="avatar">
        <div class="ring"></div>
        <div class="pic">{{#image}}<img src="assets/img/{{image}}" alt="" />{{/image}}{{^image}}<div class="ini"></div>{{/image}}</div>
        </div>
        <div class="info">
        <div class="name">{{name}}</div>
        <div class="role">{{role}}</div>
        {{?facts}}<div class="facts">{{#facts}}<div class="fact"><b></b><span>{{.}}</span></div>{{/facts}}</div>{{/?facts}}
        </div>
        </div>
      </div>
      <script>
        (() => {
          const P = {{{__props}}};
          const R = document.getElementById("{{__id}}-root");
          const $ = (s) => R.querySelector(s);
          const $$ = (s) => [...R.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          // Moment for item i of n: its keyword if spoken, else an even spread over the narration.
          const at = (i, n) => Math.min(P.D - 1, Math.max(0.5, P.marks[i] ?? P.vo + (Math.max(1, P.voEnd - P.vo) * (i + 0.15)) / n));
          const ini = $(".ini");
          if (ini) ini.textContent = String(P.name).split(/\s+/).filter((w) => /^\p{L}/u.test(w)).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
          tl.fromTo($(".pic"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.05);
          tl.fromTo($(".ring"), { opacity: 0, rotation: -60 }, { opacity: 1, rotation: 0, duration: 0.8, ease: "power2.out" }, 0.2);
          tl.to($(".ring"), { rotation: 45, duration: Math.max(1, P.D - 1.5), ease: "none" }, 1);
          tl.fromTo($(".name"), { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.35);
          tl.fromTo($(".role"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.6);
          $$(".fact").forEach((el, i, all) => tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45 }, Math.max(1, at(i, all.length))));
          tl.to($(".wrap"), { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, P.D - 0.45);
          window.__timelines["{{__id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
