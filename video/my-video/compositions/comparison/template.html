<template>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

    #root {
      position: absolute; inset: 0; overflow: hidden;
      font-family: var(--hf-font-heading, 'Inter', sans-serif);
      color: var(--hf-text, #f1f5f9);
      background: var(--hf-bg, #0a0e17);
    }
    #root .cp-bg { position: absolute; inset: 0; background: var(--hf-gradient, linear-gradient(135deg,#0a0e17,#1a1a2e)); }

    #root .cp-header {
      position: absolute; top: 50px; left: 0; right: 0; text-align: center; opacity: 0;
    }
    #root .cp-title {
      font-size: 36px; font-weight: 800; margin: 0;
      color: var(--hf-text, #f1f5f9); text-transform: uppercase; letter-spacing: 2px;
    }

    #root .cp-vs {
      position: absolute; top: 50%; left: 50%; z-index: 10;
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--hf-gradient-accent, linear-gradient(135deg, #70e1e8, #a855f7));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; color: #fff;
      box-shadow: 0 0 40px var(--hf-shadow, rgba(112,225,232,0.3));
      opacity: 0;
    }

    #root .cp-divider {
      position: absolute; top: 140px; bottom: 60px; left: 50%; width: 2px;
      background: var(--hf-border, rgba(112,225,232,0.2)); opacity: 0;
    }

    #root .cp-side {
      position: absolute; top: 160px; bottom: 80px; width: 48%;
      display: flex; flex-direction: column; padding: 40px 60px;
    }
    #root .cp-side-a { left: 0; }
    #root .cp-side-b { right: 0; }

    #root .cp-side-label {
      font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
      color: var(--hf-primary, #70e1e8); margin-bottom: 24px;
    }
    #root .cp-side-b .cp-side-label { color: var(--hf-secondary, #a855f7); }

    #root .cp-side-name {
      font-size: 48px; font-weight: 900; margin: 0 0 20px 0;
      color: var(--hf-text, #f1f5f9);
    }

    #root .cp-side-desc {
      font-size: 22px; font-weight: 400; line-height: 1.5;
      color: var(--hf-text-secondary, #94a3b8); margin: 0 0 30px 0;
    }

    #root .cp-feat {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    #root .cp-feat-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--hf-primary, #70e1e8); display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      font-size: 14px; font-weight: 800; color: var(--hf-bg, #0a0e17);
    }
    #root .cp-side-b .cp-feat-icon { background: var(--hf-secondary, #a855f7); }
    #root .cp-feat-text {
      font-size: 20px; font-weight: 500; color: var(--hf-text, #f1f5f9);
    }

    #root .cp-side, #root .cp-vs, #root .cp-divider, #root .cp-header {
      will-change: transform, opacity;
    }
  </style>

  <div id="root" data-composition-id="comparison" data-width="1920" data-height="1080">
    <div class="cp-bg"></div>
    <div class="cp-header"><div class="cp-title" id="cp-title">So sánh</div></div>
    <div class="cp-divider"></div>
    <div class="cp-vs" style="transform: translate(-50%, -50%);">VS</div>
    <div class="cp-side cp-side-a" id="cp-side-a"></div>
    <div class="cp-side cp-side-b" id="cp-side-b"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DATA = window.__hfData && window.__hfData['comparison'] ? window.__hfData['comparison'] : {
        title: 'So sánh',
        sideA: { label: 'OPTION A', name: 'Product A', description: '', features: ['Feature 1', 'Feature 2', 'Feature 3'] },
        sideB: { label: 'OPTION B', name: 'Product B', description: '', features: ['Feature 1', 'Feature 2', 'Feature 3'] }
      };

      var titleEl = document.getElementById('cp-title');
      if (DATA.title && titleEl) titleEl.textContent = DATA.title;

      function buildSide(container, side, cssClass) {
        var labelEl = document.createElement('div');
        labelEl.className = 'cp-side-label'; labelEl.textContent = side.label || '';
        container.appendChild(labelEl);

        var nameEl = document.createElement('div');
        nameEl.className = 'cp-side-name'; nameEl.textContent = side.name || '';
        container.appendChild(nameEl);

        if (side.description) {
          var descEl = document.createElement('div');
          descEl.className = 'cp-side-desc'; descEl.textContent = side.description;
          container.appendChild(descEl);
        }

        (side.features || []).forEach(function(feat, i) {
          var row = document.createElement('div');
          row.className = 'cp-feat';
          row.id = cssClass + '-feat-' + i;
          var icon = document.createElement('div');
          icon.className = 'cp-feat-icon'; icon.textContent = '✓';
          var text = document.createElement('div');
          text.className = 'cp-feat-text'; text.textContent = feat;
          row.appendChild(icon); row.appendChild(text);
          container.appendChild(row);
        });
      }

      buildSide(document.getElementById('cp-side-a'), DATA.sideA || {}, 'a');
      buildSide(document.getElementById('cp-side-b'), DATA.sideB || {}, 'b');

      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#root .cp-header', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.2)
        .fromTo('#root .cp-divider', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.7, ease: 'power3.out', transformOrigin: 'top center' }, 0.3)
        .fromTo('#root .cp-side-a', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.8, ease: 'power3.out' }, 0.5)
        .fromTo('#root .cp-side-b', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.8, ease: 'power3.out' }, 0.5)
        .fromTo('#root .cp-vs', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.7)' }, 1.0);

      // Stagger features
      var featsA = document.querySelectorAll('[id^="a-feat-"]');
      var featsB = document.querySelectorAll('[id^="b-feat-"]');
      if (featsA.length > 0) {
        tl.fromTo(featsA, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out', stagger: 0.12 }, 1.3);
      }
      if (featsB.length > 0) {
        tl.fromTo(featsB, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out', stagger: 0.12 }, 1.3);
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['comparison'] = tl;
    })();
  </script>
</template>
