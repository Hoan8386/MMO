<template>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: var(--hf-font-heading, 'Inter', sans-serif);
      color: var(--hf-text, #f1f5f9);
      background: var(--hf-bg, #0a0e17);
    }

    #root .hero-bg {
      position: absolute;
      inset: 0;
      background: var(--hf-gradient, linear-gradient(135deg, #0a0e17, #1a1a2e));

    #root .hero-grid {
      position: absolute;
      inset: 0;

        linear-gradient(var(--hf-border, rgba(112,225,232,0.08)) 1px, transparent 1px),
        linear-gradient(90deg, var(--hf-border, rgba(112,225,232,0.08)) 1px, transparent 1px);

    #root .hero-glow-2 {
      position: absolute;
      width: 500px;

      bottom: -150px;

      border-radius: 50%;
      background: radial-gradient(circle, var(--hf-shadow, rgba(168,85,247,0.1)) 0%, transparent 70%);
      opacity: 0;
    }

    #root .hero-accent-line {
      position: absolute;
      top: 0;
      left: 0;

      height: 6px;
      background: var(--hf-gradient-accent, linear-gradient(90deg, #70e1e8, #a855f7));
      opacity: 0;
    }

    #root .hero-content {
      position: absolute;

  <div id="root" data-composition-id="hero" data-width="1920" data-height="1080">
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>
    <div class="hero-glow"></div>
    <div class="hero-glow-2"></div>
    <div class="hero-accent-line"></div>
    <div class="hero-content">
      <div class="hero-category" id="hero-category">CÔNG NGHỆ</div>
      <h1 class="hero-title" id="hero-title">Tiêu đề chính</h1>
      <div class="hero-rule"></div>
      <p class="hero-subtitle" id="hero-subtitle">Mô tả phụ cho bản tin</p>
    </div>
    <div class="hero-date" id="hero-date"></div>
    <div class="hero-corner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      /* === DATA (Compiler replaces this block) === */
      var DATA = window.__hfData && window.__hfData['hero'] ? window.__hfData['hero'] : {
        title: 'Tiêu đề chính',
        subtitle: 'Mô tả phụ cho bản tin',
        category: 'CÔNG NGHỆ',
        date: ''
      };

      /* === POPULATE DOM === */
      var titleEl = document.getElementById('hero-title');
      var subtitleEl = document.getElementById('hero-subtitle');
      var categoryEl = document.getElementById('hero-category');
      var dateEl = document.getElementById('hero-date');

      if (DATA.title && titleEl) titleEl.textContent = DATA.title;
      if (DATA.subtitle && subtitleEl) subtitleEl.textContent = DATA.subtitle;
      if (DATA.category && categoryEl) categoryEl.textContent = DATA.category;
      if (DATA.date && dateEl) {
        dateEl.textContent = DATA.date;
      } else if (dateEl) {
        dateEl.style.opacity = '0';
      }

      /* Auto-fit title font size */
      if (titleEl && DATA.title) {
        var len = DATA.title.length;
        if (len > 60) titleEl.style.fontSize = '56px';
        else if (len > 40) titleEl.style.fontSize = '68px';
        else if (len > 25) titleEl.style.fontSize = '80px';
      }

      /* === ANIMATION === */
      var tl = gsap.timeline({ paused: true });

      // Background elements
      tl.fromTo('#root .hero-grid', { opacity: 0 }, { opacity: 0.5, duration: 1.0, ease: 'power2.out' }, 0)
        .fromTo('#root .hero-glow', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.4, ease: 'power2.out' }, 0.1)
        .fromTo('#root .hero-glow-2', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.4, ease: 'power2.out' }, 0.2)
        .fromTo('#root .hero-accent-line', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.8, ease: 'power3.out', transformOrigin: 'left center' }, 0.3)

      // Content entrance
        .fromTo('#root .hero-category', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.6)
        .fromTo('#root .hero-title', { opacity: 0, y: 50, x: -20 }, { opacity: 1, y: 0, x: 0, duration: 0.9, ease: 'power4.out' }, 0.9)
        .fromTo('#root .hero-rule', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: 'power3.out', transformOrigin: 'left center' }, 1.5)
        .fromTo('#root .hero-subtitle', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 1.8)

      // Decorative elements
        .fromTo('#root .hero-date', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 2.2)
        .fromTo('#root .hero-corner', { opacity: 0, x: 20, y: 20 }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: 'back.out(1.5)' }, 2.0)

      // Ambient glow movement (finite)
        .fromTo('#root .hero-glow', { x: 0 }, { x: 30, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.5)
        .fromTo('#root .hero-glow-2', { y: 0 }, { y: -20, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.5);

      window.__timelines = window.__timelines || {};
      window.__timelines['hero'] = tl;
    })();
  </script>
</template>
