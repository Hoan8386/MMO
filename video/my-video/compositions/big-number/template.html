<template>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

    #root {
      position: absolute; inset: 0; overflow: hidden;
      font-family: var(--hf-font-heading, 'Inter', sans-serif);
      color: var(--hf-text, #f1f5f9);
      background: var(--hf-bg, #0a0e17);
    }

    #root .bn-bg { position: absolute; inset: 0; background: var(--hf-gradient, linear-gradient(135deg,#0a0e17,#1a1a2e)); }

    #root .bn-content {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center; padding: 80px 120px;
    }

    #root .bn-number {
      font-size: 200px; font-weight: 900; line-height: 1;
      background: var(--hf-gradient-accent, linear-gradient(135deg, #70e1e8, #a855f7));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin: 0 0 16px 0; opacity: 0;
    }

    #root .bn-unit {
      font-size: 48px; font-weight: 700; color: var(--hf-primary, #70e1e8);
      margin-bottom: 24px; opacity: 0;
    }

    #root .bn-label {
      font-size: 36px; font-weight: 700; color: var(--hf-text, #f1f5f9);
      margin: 0 0 16px 0; text-transform: uppercase; letter-spacing: 3px; opacity: 0;
    }

    #root .bn-desc {
      font-size: 24px; font-weight: 400; color: var(--hf-text-secondary, #94a3b8);
      max-width: 800px; line-height: 1.4; margin: 0; opacity: 0;
    }

    #root .bn-bar {
      position: absolute; bottom: 120px; left: 50%; width: 200px; height: 4px;
      background: var(--hf-border, rgba(112,225,232,0.2));
      border-radius: 2px; opacity: 0;
    }

    #root .bn-bar-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 0;
      background: var(--hf-gradient-accent, linear-gradient(90deg, #70e1e8, #a855f7));
      border-radius: 2px;
    }

    #root .bn-glow-ring {
      position: absolute; top: 50%; left: 50%;
      width: 500px; height: 500px;
      border: 2px solid var(--hf-border, rgba(112,225,232,0.15));
      border-radius: 50%; opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="big-number" data-width="1920" data-height="1080">
    <div class="bn-bg"></div>
    <div class="bn-glow-ring"></div>
    <div class="bn-content">
      <div class="bn-number" id="bn-number">0</div>
      <div class="bn-unit" id="bn-unit"></div>
      <div class="bn-label" id="bn-label">Metric Label</div>
      <p class="bn-desc" id="bn-desc"></p>
    </div>
    <div class="bn-bar" style="transform: translateX(-50%);">
      <div class="bn-bar-fill" id="bn-bar-fill"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DATA = window.__hfData && window.__hfData['big-number'] ? window.__hfData['big-number'] : {
        value: 100,
        prefix: '',
        suffix: '',
        unit: '',
        label: 'Metric Label',
        description: ''
      };

      var numberEl = document.getElementById('bn-number');
      var unitEl = document.getElementById('bn-unit');
      var labelEl = document.getElementById('bn-label');
      var descEl = document.getElementById('bn-desc');
      var barFillEl = document.getElementById('bn-bar-fill');

      if (DATA.label && labelEl) labelEl.textContent = DATA.label;
      if (DATA.description && descEl) descEl.textContent = DATA.description;
      else if (descEl) descEl.style.display = 'none';
      if (DATA.unit && unitEl) unitEl.textContent = DATA.unit;
      else if (unitEl) unitEl.style.display = 'none';

      var tl = gsap.timeline({ paused: true });

      // Glow ring entrance
      tl.fromTo('#root .bn-glow-ring',
        { opacity: 0, scale: 0.6, xPercent: -50, yPercent: -50 },
        { opacity: 0.4, scale: 1, duration: 1.2, ease: 'power2.out' }, 0)

      // Number count-up
        .fromTo('#root .bn-number', { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.5)' }, 0.3);

      // Count animation
      var numVal = parseFloat(DATA.value) || 0;
      var isDecimal = String(DATA.value).indexOf('.') !== -1;
      var obj = { val: 0 };
      tl.fromTo(obj,
        { val: 0 },
        {
          val: numVal, duration: 2.0, ease: 'power2.out',
          onUpdate: function() {
            var display = isDecimal ? obj.val.toFixed(1) : Math.round(obj.val).toLocaleString('en-US');
            numberEl.textContent = (DATA.prefix || '') + display + (DATA.suffix || '');
          }
        }, 0.5);

      // Unit, label, description
      tl.fromTo('#root .bn-unit', { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.8)
        .fromTo('#root .bn-label', { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.0)
        .fromTo('#root .bn-desc', { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.3)

      // Bar animation
        .fromTo('#root .bn-bar', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 2.5)
        .fromTo(barFillEl, { width: '0%' }, { width: '100%', duration: 1.2, ease: 'power3.out' }, 2.7)

      // Ambient ring pulse (finite)
        .fromTo('#root .bn-glow-ring', { scale: 1 }, { scale: 1.08, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.5);

      window.__timelines = window.__timelines || {};
      window.__timelines['big-number'] = tl;
    })();
  </script>
</template>
