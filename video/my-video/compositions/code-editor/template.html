<template>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap");
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap");

    #root {
      position: absolute; inset: 0; overflow: hidden;
      font-family: var(--hf-font-mono, 'JetBrains Mono', monospace);
      color: var(--hf-text, #f1f5f9);
      background: var(--hf-bg, #0a0e17);
    }

    #root .ce-bg { position: absolute; inset: 0; background: #1e1e2e; }

    #root .ce-window {
      position: absolute; top: 60px; left: 80px; right: 80px; bottom: 60px;
      background: #1e1e2e; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 25px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column;
      opacity: 0;
    }

    #root .ce-titlebar {
      height: 44px; background: #181825; border-radius: 12px 12px 0 0;
      display: flex; align-items: center; padding: 0 16px; gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #root .ce-dot { width: 12px; height: 12px; border-radius: 50%; }
    #root .ce-dot-r { background: #f38ba8; }
    #root .ce-dot-y { background: #f9e2af; }
    #root .ce-dot-g { background: #a6e3a1; }
    #root .ce-filename {
      font-size: 13px; color: #a6adc8; margin-left: 12px;
      font-family: var(--hf-font-body, 'Inter', sans-serif);
    }

    #root .ce-body { flex: 1; display: flex; overflow: hidden; }

    #root .ce-gutter {
      width: 60px; background: #181825; padding: 20px 0;
      display: flex; flex-direction: column; align-items: flex-end; padding-right: 16px;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    #root .ce-line-num {
      font-size: 16px; line-height: 32px; color: #585b70; user-select: none;
    }

    #root .ce-code {
      flex: 1; padding: 20px 24px; overflow: hidden;
    }
    #root .ce-code-line {
      font-size: 18px; line-height: 32px; white-space: pre; opacity: 0;
    }

    /* Syntax colors (Catppuccin Mocha) */
    #root .syn-kw { color: #cba6f7; }     /* keyword */
    #root .syn-fn { color: #89b4fa; }     /* function */
    #root .syn-str { color: #a6e3a1; }    /* string */
    #root .syn-num { color: #fab387; }    /* number */
    #root .syn-cm { color: #585b70; }     /* comment */
    #root .syn-type { color: #f9e2af; }   /* type */
    #root .syn-op { color: #89dceb; }     /* operator */
    #root .syn-var { color: #cdd6f4; }    /* variable */

    #root .ce-header {
      position: absolute; top: 20px; left: 80px;
      font-family: var(--hf-font-heading, 'Inter', sans-serif);
      font-size: 18px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
      color: var(--hf-primary, #70e1e8); opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="code-editor" data-width="1920" data-height="1080">
    <div class="ce-bg"></div>
    <div class="ce-header" id="ce-header"></div>
    <div class="ce-window" id="ce-window">
      <div class="ce-titlebar">
        <div class="ce-dot ce-dot-r"></div>
        <div class="ce-dot ce-dot-y"></div>
        <div class="ce-dot ce-dot-g"></div>
        <span class="ce-filename" id="ce-filename">main.py</span>
      </div>
      <div class="ce-body">
        <div class="ce-gutter" id="ce-gutter"></div>
        <div class="ce-code" id="ce-code"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DATA = window.__hfData && window.__hfData['code-editor'] ? window.__hfData['code-editor'] : {
        header: '',
        filename: 'main.py',
        language: 'python',
        lines: [
          { text: '# AI Pipeline Configuration', classes: 'syn-cm' },
          { text: '', classes: '' },
          { text: 'import openai', classes: 'syn-kw' },
          { text: 'from transformers import pipeline', classes: 'syn-kw' },
          { text: '', classes: '' },
          { text: 'def analyze_news(content):', classes: '' },
          { text: '    """Analyze news with AI"""', classes: 'syn-str' },
          { text: '    model = "gpt-4o"', classes: '' },
          { text: '    response = openai.chat(', classes: '' },
          { text: '        model=model,', classes: '' },
          { text: '        messages=[{', classes: '' },
          { text: '            "role": "system",', classes: 'syn-str' },
          { text: '            "content": content', classes: '' },
          { text: '        }]', classes: '' },
          { text: '    )', classes: '' },
          { text: '    return response.choices[0]', classes: '' }
        ]
      };

      var headerEl = document.getElementById('ce-header');
      var filenameEl = document.getElementById('ce-filename');
      var gutterEl = document.getElementById('ce-gutter');
      var codeEl = document.getElementById('ce-code');

      if (DATA.header && headerEl) headerEl.textContent = DATA.header;
      if (DATA.filename && filenameEl) filenameEl.textContent = DATA.filename;

      var codeLines = DATA.lines || [];
      var lineEls = [];

      codeLines.forEach(function(line, i) {
        // Gutter line number
        var numEl = document.createElement('div');
        numEl.className = 'ce-line-num';
        numEl.textContent = i + 1;
        gutterEl.appendChild(numEl);

        // Code line
        var lineEl = document.createElement('div');
        lineEl.className = 'ce-code-line';
        lineEl.id = 'ce-line-' + i;

        if (line.classes) {
          var span = document.createElement('span');
          span.className = line.classes;
          span.textContent = line.text;
          lineEl.appendChild(span);
        } else {
          lineEl.textContent = line.text;
        }

        codeEl.appendChild(lineEl);
        lineEls.push(lineEl);
      });

      var tl = gsap.timeline({ paused: true });

      // Window entrance
      tl.fromTo('#root .ce-header', { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.1)
        .fromTo('#root .ce-window', { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'power3.out' }, 0.2);

      // Code lines appear with stagger (simulates typing)
      lineEls.forEach(function(el, i) {
        tl.fromTo(el,
          { opacity: 0, x: -10 },
          { opacity: 1, x: 0, duration: 0.25, ease: 'power2.out' },
          0.8 + i * 0.12
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines['code-editor'] = tl;
    })();
  </script>
</template>
