<template>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

    #root {
      position: absolute; inset: 0; overflow: hidden;
      font-family: var(--hf-font-heading, 'Inter', sans-serif);
      color: var(--hf-text, #f1f5f9);
      background: var(--hf-bg, #0a0e17);
    }
    #root .tl-bg { position: absolute; inset: 0; background: var(--hf-gradient, linear-gradient(135deg,#0a0e17,#1a1a2e)); }

    #root .tl-header {
      position: absolute; top: 50px; left: 100px; right: 100px; opacity: 0;
    }
    #root .tl-title {
      font-size: 36px; font-weight: 800; margin: 0; text-transform: uppercase;
      letter-spacing: 2px; color: var(--hf-text, #f1f5f9);
    }

    #root .tl-track {
      position: absolute; top: 50%; left: 120px; right: 120px;
      height: 4px; background: var(--hf-border, rgba(112,225,232,0.2));
      opacity: 0; transform-origin: left center;
    }
    #root .tl-track-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 0;
      background: var(--hf-gradient-accent, linear-gradient(90deg, #70e1e8, #a855f7));
    }

    #root .tl-items {
      position: absolute; top: 0; bottom: 0; left: 120px; right: 120px;
      display: flex; align-items: center; justify-content: space-between;
    }

    #root .tl-item {
      display: flex; flex-direction: column; align-items: center;
      position: relative; opacity: 0;
    }

    #root .tl-dot {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--hf-primary, #70e1e8); border: 4px solid var(--hf-bg, #0a0e17);
      z-index: 2; box-shadow: 0 0 15px var(--hf-glow-color, rgba(112,225,232,0.3));
    }

    #root .tl-content-up {
      position: absolute; bottom: 40px; text-align: center; width: 220px;
    }
    #root .tl-content-down {
      position: absolute; top: 40px; text-align: center; width: 220px;
    }

    #root .tl-year {
      font-size: 28px; font-weight: 900; color: var(--hf-primary, #70e1e8);
      margin-bottom: 8px;
    }
    #root .tl-label {
      font-size: 18px; font-weight: 600; color: var(--hf-text, #f1f5f9);
      margin-bottom: 4px; line-height: 1.3;
    }
    #root .tl-desc {
      font-size: 14px; font-weight: 400; color: var(--hf-text-secondary, #94a3b8);
      line-height: 1.4;
    }
  </style>

  <div id="root" data-composition-id="timeline-view" data-width="1920" data-height="1080">
    <div class="tl-bg"></div>
    <div class="tl-header"><div class="tl-title" id="tl-title">Timeline</div></div>
    <div class="tl-track" id="tl-track">
      <div class="tl-track-fill" id="tl-track-fill"></div>
    </div>
    <div class="tl-items" id="tl-items"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DATA = window.__hfData && window.__hfData['timeline-view'] ? window.__hfData['timeline-view'] : {
        title: 'Timeline',
        items: [
          { year: '2020', label: 'Foundation', description: 'Project started' },
          { year: '2022', label: 'Launch', description: 'Product released' },
          { year: '2024', label: 'Scale', description: '1M users reached' },
          { year: '2026', label: 'AI Era', description: 'AI integration' }
        ]
      };

      var titleEl = document.getElementById('tl-title');
      if (DATA.title && titleEl) titleEl.textContent = DATA.title;

      var itemsEl = document.getElementById('tl-items');
      var items = DATA.items || [];
      var itemEls = [];

      items.forEach(function(item, i) {
        var el = document.createElement('div');
        el.className = 'tl-item';
        el.id = 'tl-item-' + i;

        var dot = document.createElement('div');
        dot.className = 'tl-dot';

        // Alternate up/down
        var contentClass = i % 2 === 0 ? 'tl-content-up' : 'tl-content-down';
        var content = document.createElement('div');
        content.className = contentClass;

        var yearEl = document.createElement('div');
        yearEl.className = 'tl-year'; yearEl.textContent = item.year || '';

        var labelEl = document.createElement('div');
        labelEl.className = 'tl-label'; labelEl.textContent = item.label || '';

        var descEl = document.createElement('div');
        descEl.className = 'tl-desc'; descEl.textContent = item.description || '';

        content.appendChild(yearEl);
        content.appendChild(labelEl);
        if (item.description) content.appendChild(descEl);

        el.appendChild(dot);
        el.appendChild(content);
        itemsEl.appendChild(el);
        itemEls.push(el);
      });

      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#root .tl-header', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.2)
        .fromTo('#root .tl-track', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.8, ease: 'power3.out' }, 0.4)
        .fromTo('#root .tl-track-fill', { width: '0%' }, { width: '100%', duration: 2.0, ease: 'power2.out' }, 0.8);

      itemEls.forEach(function(el, i) {
        tl.fromTo(el,
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.5)' },
          1.0 + i * 0.4
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines['timeline-view'] = tl;
    })();
  </script>
</template>
