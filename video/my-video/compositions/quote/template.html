<template>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

    #root {
      position: absolute; inset: 0; overflow: hidden;
      font-family: var(--hf-font-heading, 'Inter', sans-serif);
      color: var(--hf-text, #f1f5f9);
      background: var(--hf-bg, #0a0e17);
    }
    #root .qt-bg { position: absolute; inset: 0; background: var(--hf-gradient, linear-gradient(135deg,#0a0e17,#1a1a2e)); }

    #root .qt-content {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 100px 160px; text-align: center;
    }

    #root .qt-mark {
      font-size: 160px; font-weight: 900; line-height: 0.6;
      color: var(--hf-primary, #70e1e8); opacity: 0.15;
      margin-bottom: -20px; opacity: 0;
    }

    #root .qt-text {
      font-size: 44px; font-weight: 600; line-height: 1.4;
      color: var(--hf-text, #f1f5f9); max-width: 1200px;
      margin: 0 0 48px 0; font-style: italic; opacity: 0;
    }

    #root .qt-rule {
      width: 80px; height: 3px;
      background: var(--hf-gradient-accent, linear-gradient(90deg, #70e1e8, #a855f7));
      border-radius: 2px; margin-bottom: 28px; opacity: 0;
    }

    #root .qt-author {
      font-size: 22px; font-weight: 700; color: var(--hf-primary, #70e1e8);
      margin: 0 0 8px 0; opacity: 0;
    }

    #root .qt-role {
      font-size: 18px; font-weight: 400; color: var(--hf-text-muted, #64748b);
      margin: 0; opacity: 0;
    }

    #root .qt-glow {
      position: absolute; width: 400px; height: 400px;
      border-radius: 50%; top: 50%; left: 50%;
      background: radial-gradient(circle, var(--hf-glow-color, rgba(112,225,232,0.08)) 0%, transparent 70%);
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="quote" data-width="1920" data-height="1080">
    <div class="qt-bg"></div>
    <div class="qt-glow" style="transform: translate(-50%, -50%);"></div>
    <div class="qt-content">
      <div class="qt-mark">"</div>
      <p class="qt-text" id="qt-text">Quote text goes here</p>
      <div class="qt-rule"></div>
      <div class="qt-author" id="qt-author">Author Name</div>
      <div class="qt-role" id="qt-role"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DATA = window.__hfData && window.__hfData['quote'] ? window.__hfData['quote'] : {
        text: 'Quote text goes here',
        author: 'Author Name',
        role: ''
      };

      var textEl = document.getElementById('qt-text');
      var authorEl = document.getElementById('qt-author');
      var roleEl = document.getElementById('qt-role');

      if (DATA.text && textEl) textEl.textContent = DATA.text;
      if (DATA.author && authorEl) authorEl.textContent = DATA.author;
      if (DATA.role && roleEl) roleEl.textContent = DATA.role;
      else if (roleEl) roleEl.style.display = 'none';

      // Auto-fit quote size
      if (textEl && DATA.text) {
        if (DATA.text.length > 200) textEl.style.fontSize = '32px';
        else if (DATA.text.length > 120) textEl.style.fontSize = '38px';
      }

      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#root .qt-glow', { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 1.2, ease: 'power2.out' }, 0)
        .fromTo('#root .qt-mark', { opacity: 0, scale: 0.5, y: 20 }, { opacity: 0.15, scale: 1, y: 0, duration: 0.7, ease: 'back.out(1.5)' }, 0.3)
        .fromTo('#root .qt-text', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.6)
        .fromTo('#root .qt-rule', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: 'power3.out' }, 1.2)
        .fromTo('#root .qt-author', { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.5)
        .fromTo('#root .qt-role', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 1.8);

      window.__timelines = window.__timelines || {};
      window.__timelines['quote'] = tl;
    })();
  </script>
</template>
