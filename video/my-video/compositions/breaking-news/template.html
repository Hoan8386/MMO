<template>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");

    #root {
      position: absolute; inset: 0; overflow: hidden;
      font-family: var(--hf-font-heading, 'Inter', sans-serif);
      color: var(--hf-text, #f1f5f9);
      background: var(--hf-bg, #0a0e17);
    }

    #root .bn-bg { position: absolute; inset: 0; background: var(--hf-gradient, linear-gradient(135deg,#0a0e17,#1a1a2e)); }

    #root .bn-accent-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 8px;
      background: var(--hf-danger, #ef4444); opacity: 0;
    }

    #root .bn-badge {
      position: absolute; top: 60px; left: 100px;
      background: var(--hf-danger, #ef4444); color: #fff;
      padding: 12px 32px; font-size: 20px; font-weight: 800;
      letter-spacing: 4px; text-transform: uppercase;
      border-radius: var(--hf-radius-sm, 4px); opacity: 0;
    }

    #root .bn-dot {
      display: inline-block; width: 10px; height: 10px;
      background: #fff; border-radius: 50%; margin-right: 12px;
      vertical-align: middle;
    }

    #root .bn-content {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; padding: 80px 100px;
    }

    #root .bn-title {
      font-size: 80px; font-weight: 900; line-height: 1.05;
      max-width: 1400px; margin: 0 0 28px 0;
      color: var(--hf-text, #fff); text-transform: uppercase; opacity: 0;
    }

    #root .bn-rule {
      width: 100px; height: 4px; background: var(--hf-danger, #ef4444);
      margin-bottom: 24px; opacity: 0;
    }

    #root .bn-subtitle {
      font-size: 28px; font-weight: 400; line-height: 1.4;
      color: var(--hf-text-secondary, #fecaca); max-width: 1000px;
      margin: 0; opacity: 0;
    }

    #root .bn-time {
      position: absolute; bottom: 50px; right: 100px;
      font-size: 18px; font-weight: 600; letter-spacing: 3px;
      color: var(--hf-text-muted, #fca5a5); opacity: 0;
    }

    #root .bn-stripe-l, #root .bn-stripe-r {
      position: absolute; bottom: 0; height: 60px;
      background: repeating-linear-gradient(
        -45deg,
        var(--hf-danger, #ef4444),
        var(--hf-danger, #ef4444) 20px,
        transparent 20px,
        transparent 40px
      );
      opacity: 0;
    }
    #root .bn-stripe-l { left: 0; width: 300px; }
    #root .bn-stripe-r { right: 0; width: 300px; }
  </style>

  <div id="root" data-composition-id="breaking-news" data-width="1920" data-height="1080">
    <div class="bn-bg"></div>
    <div class="bn-accent-bar"></div>
    <div class="bn-badge"><span class="bn-dot"></span><span id="bn-badge-text">TIN NÓNG</span></div>
    <div class="bn-content">
      <h1 class="bn-title" id="bn-title">Breaking news headline</h1>
      <div class="bn-rule"></div>
      <p class="bn-subtitle" id="bn-subtitle">Supporting details</p>
    </div>
    <div class="bn-time" id="bn-time"></div>
    <div class="bn-stripe-l"></div>
    <div class="bn-stripe-r"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DATA = window.__hfData && window.__hfData['breaking-news'] ? window.__hfData['breaking-news'] : {
        title: 'Breaking news headline',
        subtitle: 'Supporting details',
        badge: 'TIN NÓNG',
        time: ''
      };

      var titleEl = document.getElementById('bn-title');
      var subtitleEl = document.getElementById('bn-subtitle');
      var badgeEl = document.getElementById('bn-badge-text');
      var timeEl = document.getElementById('bn-time');

      if (DATA.title && titleEl) titleEl.textContent = DATA.title;
      if (DATA.subtitle && subtitleEl) subtitleEl.textContent = DATA.subtitle;
      if (DATA.badge && badgeEl) badgeEl.textContent = DATA.badge;
      if (DATA.time && timeEl) timeEl.textContent = DATA.time;
      else if (timeEl) timeEl.style.display = 'none';

      if (titleEl && DATA.title && DATA.title.length > 50) titleEl.style.fontSize = '60px';

      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#root .bn-accent-bar', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: 'power3.out', transformOrigin: 'left center' }, 0)
        .fromTo('#root .bn-badge', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, 0.3)
        .fromTo('#root .bn-dot', { scale: 0 }, { scale: 1, duration: 0.3, ease: 'power2.out' }, 0.5)
        // Pulsing dot (finite)
        .fromTo('#root .bn-dot', { opacity: 1 }, { opacity: 0.3, duration: 0.4, ease: 'sine.inOut', yoyo: true, repeat: 7 }, 0.8)
        .fromTo('#root .bn-title', { opacity: 0, y: 40, x: -15 }, { opacity: 1, y: 0, x: 0, duration: 0.8, ease: 'power4.out' }, 0.5)
        .fromTo('#root .bn-rule', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: 'power3.out', transformOrigin: 'left center' }, 1.1)
        .fromTo('#root .bn-subtitle', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 1.3)
        .fromTo('#root .bn-time', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.6)
        .fromTo('#root .bn-stripe-l', { opacity: 0, x: -100 }, { opacity: 0.15, x: 0, duration: 0.6, ease: 'power2.out' }, 0.4)
        .fromTo('#root .bn-stripe-r', { opacity: 0, x: 100 }, { opacity: 0.15, x: 0, duration: 0.6, ease: 'power2.out' }, 0.4);

      window.__timelines = window.__timelines || {};
      window.__timelines['breaking-news'] = tl;
    })();
  </script>
</template>
